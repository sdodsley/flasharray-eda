---
# Loaded by ansible-rulebook (--vars). Rulebooks forward what each playbook
# needs as extra_vars, because run_playbook copies the playbook's directory
# (playbooks/) into a temporary project; vars/ is not there, so relative
# vars_files paths do not resolve.
# Copy to vars/local-<site>.yml (gitignored) and edit. Comments give sane
# production values; the intervals set here are short, for a test run.
# Uppercase names in the rulebooks ({{ APPROVAL_TOKEN }},
# {{ GIT_WEBHOOK_SECRET }}) are environment variables handed over with
# --env-vars (run.sh does that), never keys in this file.

# --- arrays the source plugin polls ---------------------------------------
# name must match the inventory host name. Tokens and URLs come from the
# environment (api_token_env / fa_url_env) so this file holds no secrets.
# Every array listed here needs both variables set (see env.example); the
# plugin refuses to start otherwise. For a single array remove array-b here,
# in the inventory and from dr_drills below.
purefa_arrays:
  - name: array-a
    fa_url_env: ARRAY_A_URL
    api_token_env: ARRAY_A_TOKEN
  - name: array-b
    fa_url_env: ARRAY_B_URL
    api_token_env: ARRAY_B_TOKEN

# Arrays polled by the config drift ruleset (one vars baseline per ruleset;
# copy the ruleset for arrays with a different baseline) and by the change
# control ruleset (baseline per array under baseline_dir).
config_arrays:
  - name: array-a
    fa_url_env: ARRAY_A_URL
    api_token_env: ARRAY_A_TOKEN

# Every playbook appends one JSON line per action here (time, kind, severity,
# array, ...). Absolute path; the directory must exist and be writable by the
# rulebook user. The /var default needs root or a pre-created, chowned
# directory; for a local run point it somewhere under $HOME.
alert_log: /var/log/flasharray-eda/alerts.log

# --- polling intervals (seconds) ------------------------------------------
alerts_interval: 30          # production: 60
audits_interval: 15          # production: 15-60
health_interval: 60          # production: 300
telemetry_interval: 60       # production: 60-300
replication_interval: 60     # production: 60
config_interval: 300         # production: 300-900

# --- config baseline for config_arrays ------------------------------------
# List-valued settings are sorted, comma-joined strings: the plugin emits
# them in that form so a rule compares with a single !=, and the remediation
# playbooks split them back into lists.
baseline_ntp_servers_csv: "0.pool.ntp.org,1.pool.ntp.org"
baseline_dns_domain: example.com
baseline_dns_nameservers_csv: "192.0.2.53,192.0.2.54"
baseline_ldap_enabled: true
baseline_ldap_uris_csv: "ldaps://ldap.example.com"
baseline_ldap_base_dn: "DC=example,DC=com"
# /arrays eradication_config.manual_eradication: all-enabled means SafeMode is
# NOT engaged; a SafeMode-protected array reports all-disabled or partially.
baseline_manual_eradication: all-enabled
baseline_min_eradication_delay_ms: 86400000      # 24h; alert if shortened below
# Admin authentication baseline (notify-only rule). These are example
# hardened values, not factory defaults: set them to the site's own policy,
# because the rule fires whenever the array differs from what is written
# here (a weaker baseline than the array would warn on every poll after
# someone hardens it).
baseline_max_login_attempts: 5
baseline_lockout_duration_ms: 1800000            # 30 minutes
baseline_min_password_length: 12
baseline_sso_enabled: false

# --- thresholds -------------------------------------------------------------
capacity_risk_pct: 85
capacity_days_to_full_warning: 30
hotspot_latency_usec: 2000        # per-volume read or write latency
hotspot_consecutive_polls: 3
array_hot_latency_usec: 1000      # array-level read or write latency
hotspot_min_iops: 1
baseline_latency_ratio: 3         # now vs the same half hour last week
rpo_seconds: 300                  # replica-link lag above this is a breach

# Cooldowns live in the rulebooks as literal `throttle: once_within:` values;
# ansible-rulebook validates that field against its schema before variable
# substitution, so it cannot be templated from here.

# --- change control (audits signal) -----------------------------------------
# The identity the remediation playbooks authenticate as. Audit records by
# these users are logged, never reconciled. Use a dedicated service account.
automation_users:
  - svc-eda
# Commands whose audit record triggers a reconcile (or a notification for the
# ones the reconcile playbook does not rewrite).
governed_commands:
  - puredns
  - pureds
  - purearray
  - pureadmin
  - puresmtp
  - puresyslog
  - puresnmp
  - purealert
# Human-run destructive commands worth a notification in their own right.
destructive_commands:
  - purevol
  - puresnap
  - purepgroup
  - purepod
  - purehost
  - purehgroup
destructive_subcommands:
  - destroy
  - eradicate
  - disconnect
# Checkout of the baseline repository (see baseline/README.md), absolute
# path. A separate checkout, not this tree: apply_baseline.yml runs
# `git pull` in it.
baseline_dir: /opt/flasharray-eda-baseline
# Port the change control rulebook listens on for the git push webhook. The
# POST must carry X-Hub-Signature-256 (GitHub's hex HMAC-SHA256 of the body)
# made with the GIT_WEBHOOK_SECRET environment variable.
webhook_port: 5000

# --- alert runbooks (alerts signal) ---------------------------------------
# alert code (as a string) -> how to route it. Unknown codes use `default`.
# route: notify | ticket | tasks (ticket + include playbooks/runbooks/<code>.yml,
# found relative to the playbook; ansible-rulebook copies all of playbooks/)
alert_runbooks:
  default: {route: notify, note: ""}
  "42": {route: ticket, severity: warning, note: "Hardware failure: check the identify LED, open a case with the alert text."}
  "120": {route: ticket, severity: critical, note: "Stretched pod offline on peer: check the replication paths and the mediator before touching the pod."}
  "122": {route: ticket, severity: critical, note: "Mediator unhealthy: verify DNS and outbound HTTPS from both arrays."}
  "13": {route: tasks, note: "NTP not synchronised: runbooks/13.yml reapplies the baseline NTP servers; compare with them if it persists."}
# component type -> route, for codes the map above does not name (the alert's
# component_type: hardware, software, array, ...); default still applies last.
alert_runbooks_by_type: {}
#  hardware: {route: ticket, note: "Hardware alert without a code entry: check the identify LED."}


# --- replication actions (replication signal) ----------------------------
rpo_escalate_polls: 4                 # RPO breached this many polls in a row -> critical
replication_auto_replicate_now: true  # overdue/stuck protection group -> immediate replicated snapshot
activecluster_auto_prefer: true       # stretched pod member offline -> host preferred arrays to the online side
# Scheduled DR drill: copy a volume from the latest replicated snapshot on the
# target, verify it, destroy it. One entry per replicated protection group
# (needs two arrays; drop the entry for a single array). The interval drives
# the standalone drill, which runs that long after the rulebook starts and
# every interval after; on the platform the ruleset is left out and the
# controller schedule "FlashArray - DR drill (nightly)" runs the drill at a
# fixed hour (aap/seed.yml).
dr_drill_interval_s: 86400
dr_drills:
  - target_array: array-b
    source_array: array-a
    pgroup: pg-prod
    volume: ""            # member volume name on the source; empty = first member
    prefix: eda-drill

# --- capacity approvals and QoS (telemetry signal) --------------------------
# Approval requests are written to request_dir (absolute path, writable by
# the rulebook user, same caveat as alert_log) and answered on the approvals
# webhook, which needs the APPROVAL_TOKEN environment variable as a bearer
# token:
#   curl -X POST http://<eda host>:<approval_port>/endpoint \
#        -H "Authorization: Bearer $APPROVAL_TOKEN" -H 'Content-Type: application/json' \
#        -d '{"request_id": "<id>", "approve": true, "approver": "jane", "action": "eradicate_pending"}'
request_dir: /var/lib/flasharray-eda/requests
approval_port: 5001
# Orchestrator handoff (docs/ORCHESTRATOR.md). When true, the capacity-at-risk
# rule posts the event to Red Hat's automation orchestrator (or its upstream,
# Syntara) and the approval happens in a workflow there; the request file and
# the approvals webhook are not used for that rule. When false, the local
# approval path above runs unchanged. The service account credentials are the
# AO_CLIENT_ID / AO_CLIENT_SECRET environment variables (env.example), never
# keys here.
orchestrator_enabled: false
orchestrator_url: https://orchestrator.example.com
# webhook_path of the EDA trigger in the published workflow, one per route
# (the service account must be bound to each trigger, or the post gets 403).
orchestrator_paths:
  capacity: fa_capacity
  replication: fa_replication   # overdue or stuck protection group -> approval, then replicate now
orchestrator_validate_certs: true  # the orchestrator normally carries a real certificate
# When a capacity handoff fails (orchestrator down, token refused), raise the
# local request anyway so the approvals webhook can answer it. Off by default:
# on a platform the request file would live in a job's /tmp.
orchestrator_fallback_local: false
qos_auto_cap: true                # noisy neighbour on a hot array -> temporary IOPS cap
qos_cap_iops: 20000               # the cap applied
qos_cap_min_iops_share_pct: 40    # only volumes holding at least this share of the array's IOPS
qos_lift_normal_polls: 5          # lift after this many consecutive normal polls

# --- anomaly (composite rule) --------------------------------------------
anomaly_drr_drop_pct: 10          # data reduction this far below a week ago
anomaly_snapshot_growth_pct: 25   # snapshot space this far above a week ago
anomaly_write_surge_ratio: 3      # write bandwidth this many times last week's
anomaly_extend_eradication_by_s: 86400   # lengthen the eradication delay by a day

# --- push and zero-code paths ----------------------------------------------
# purefa_syslog listener (point the arrays' syslog target here, for example
# tcp://<this host>:5140; 514 needs root). The listener has no
# authentication: bind it to an interface the arrays reach and list the
# arrays' addresses in syslog_allowed_sources. An array forwards its
# controllers' whole system log, so the listener keeps the Purity programs
# and drops the rest.
syslog_host: 0.0.0.0
syslog_port: 5140
syslog_allowed_sources: []       # [] = accept any sender; otherwise IPv4/IPv6 addresses or CIDR prefixes, e.g. ["192.0.2.0/24", "2001:db8::10"]
syslog_programs: [purity.alert, purity.audit, purity.test]   # programs emitted as events; [] or "all" passes every program through as kind other
syslog_hostnames: {}             # array name or syslog hostname -> inventory array name, when they differ
# ansible.eda.alertmanager listener for prometheus/flasharray.rules.yml. The
# stock source has no token option: bind it to an interface only Alertmanager
# reaches, or put it behind the EDA controller's event streams / a reverse
# proxy that authenticates.
alertmanager_host: 0.0.0.0
alertmanager_port: 5002

# --- Ansible Automation Platform ------------------------------------------
# The organization the job templates live in (aap_organization in
# aap/vars/example.yml). Used by the platform rulebooks only
# (extensions/eda/rulebooks/platform/, whose run_job_template actions name
# it); the standalone rulebooks do not read it.
aap_organization: FlashArray
