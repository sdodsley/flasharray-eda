---
# Alerts: every alert state change on the array, routed through the
# alert-code runbook map (vars: alert_runbooks) with the array's own
# recommended action text and knowledge base link carried into the record.
# Alerts already open when the rulebook starts arrive with transition
# "initial" and are only logged. Inside a maintenance window an opened alert
# is logged, not routed.

- name: FlashArray alerts
  hosts: all

  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: "{{ purefa_arrays }}"
        signals: [alerts]
        alerts_interval: "{{ alerts_interval }}"

  rules:
    # A poll that fails once is a blip; one that keeps failing is an array
    # nobody is watching. The first failure of a streak is recorded at info
    # (the alert log; under the default Slack floor), once an hour per array
    # and signal, because health.yml already pages for the array itself and
    # eight rulebooks poll the same arrays; a streak the plugin flags as
    # escalated (poll_error_escalate, default 10 polls) pages at critical once
    # every six hours, since a signal that fails on its own is worth a page.
    # Anything in between is logged below.
    - name: Poll failing for many polls - escalate
      condition: >-
        event.purefa_poll_error is defined and
        event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row"
            detail: "{{ event.purefa_poll_error.error }}"
            target_array: "{{ event.purefa_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Poll failed - notify once
      condition: >-
        event.purefa_poll_error is defined and
        event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed"
            detail: "{{ event.purefa_poll_error.error }}"
            target_array: "{{ event.purefa_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: "poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}"

    - name: Alert already open at start-up - log only
      condition: event.purefa_alert.transition == "initial"
      action:
        debug:
          msg: >-
            open at start: {{ event.purefa_alert.array }} #{{ event.purefa_alert.alert_id }}
            code {{ event.purefa_alert.code }} {{ event.purefa_alert.severity }} {{ event.purefa_alert.summary }}

    - name: Alert opened during a maintenance window - log only
      condition: >-
        event.purefa_alert.transition == "opened" and
        event.purefa_alert.maintenance_active == true
      action:
        debug:
          msg: "maintenance window on {{ event.purefa_alert.array }}: alert {{ event.purefa_alert.code }} {{ event.purefa_alert.summary }} not routed"

    - name: Alert opened - route through the runbook map
      condition: >-
        event.purefa_alert.transition == "opened" and
        event.purefa_alert.maintenance_active == false
      action:
        run_playbook:
          name: playbooks/alert_runbook.yml
          extra_vars:
            severity: "{{ event.purefa_alert.severity }}"
            transition: opened
            subject: "{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }}: {{ event.purefa_alert.summary }}"
            component: "{{ event.purefa_alert.component_type }}:{{ event.purefa_alert.component_name }}"
            array_action: "{{ event.purefa_alert.action }}"
            knowledge_base_url: "{{ event.purefa_alert.knowledge_base_url }}"
            target_array: "{{ event.purefa_alert.array }}"
            alert_id: "{{ event.purefa_alert.alert_id }}"
            alert_code: "{{ event.purefa_alert.code }}"
            alert_runbooks: "{{ alert_runbooks }}"
            alert_runbooks_by_type: "{{ alert_runbooks_by_type | default({}) }}"
            component_type: "{{ event.purefa_alert.component_type }}"
            baseline_ntp_servers_csv: "{{ baseline_ntp_servers_csv | default('') }}"
            alert_log: "{{ alert_log }}"

    # An alert whose severity rose since the last poll is routed again, as a
    # new alert would be, carrying the severity it had.
    - name: Alert severity raised - route through the runbook map again
      condition: >-
        event.purefa_alert.transition == "updated" and
        event.purefa_alert.severity_raised == true and
        event.purefa_alert.maintenance_active == false
      action:
        run_playbook:
          name: playbooks/alert_runbook.yml
          extra_vars:
            severity: "{{ event.purefa_alert.severity }}"
            transition: updated
            previous_severity: "{{ event.purefa_alert.previous_severity }}"
            subject: "{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }}: {{ event.purefa_alert.summary }}"
            component: "{{ event.purefa_alert.component_type }}:{{ event.purefa_alert.component_name }}"
            array_action: "{{ event.purefa_alert.action }}"
            knowledge_base_url: "{{ event.purefa_alert.knowledge_base_url }}"
            target_array: "{{ event.purefa_alert.array }}"
            alert_id: "{{ event.purefa_alert.alert_id }}"
            alert_code: "{{ event.purefa_alert.code }}"
            alert_runbooks: "{{ alert_runbooks }}"
            alert_runbooks_by_type: "{{ alert_runbooks_by_type | default({}) }}"
            component_type: "{{ event.purefa_alert.component_type }}"
            baseline_ntp_servers_csv: "{{ baseline_ntp_servers_csv | default('') }}"
            alert_log: "{{ alert_log }}"

    # The array marks a resolved alert closing, and only a day later closed,
    # so closing is the resolved signal: one notice, a severity below the
    # alert's own, with the time it was open. The closed event a day later is
    # a log line.
    - name: Alert resolved - notify
      condition: event.purefa_alert.transition == "closing"
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: "{{ event.purefa_alert.severity_down }}"
            subject: "{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }} resolved: {{ event.purefa_alert.summary }}"
            detail: "open for {{ event.purefa_alert.resolved_after_s }} s; {{ event.purefa_alert.action }}"
            target_array: "{{ event.purefa_alert.array }}"
            alert_id: "{{ event.purefa_alert.alert_id }}"
            alert_code: "{{ event.purefa_alert.code }}"
            alert_log: "{{ alert_log }}"

    - name: Alert closed - log
      condition: event.purefa_alert.transition == "closed"
      action:
        debug:
          msg: >-
            closed: {{ event.purefa_alert.array }} #{{ event.purefa_alert.alert_id }} code {{ event.purefa_alert.code }}
            (a resolved alert reads closed a day after closing; the resolved notice went out then)
