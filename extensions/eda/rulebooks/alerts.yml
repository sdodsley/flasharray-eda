---
# Alerts: every alert state change on the array, with the array's own
# recommended action text and knowledge base link carried into the
# notification. Alerts already open when the rulebook starts arrive with
# transition "initial" and are only logged.

- name: FlashArray alerts
  hosts: all

  sources:
    - purefa_events:
        arrays: "{{ purefa_arrays }}"
        signals: [alerts]
        alerts_interval: "{{ alerts_interval }}"

  rules:
    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: "poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}"

    - name: Alert already open at start-up - log only
      condition: event.purefa_alert.transition == "initial"
      action:
        debug:
          msg: "open at start: {{ event.purefa_alert.array }} #{{ event.purefa_alert.alert_id }} code {{ event.purefa_alert.code }} {{ event.purefa_alert.severity }} {{ event.purefa_alert.summary }}"

    - name: Alert opened - notify
      condition: event.purefa_alert.transition == "opened"
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: "{{ event.purefa_alert.severity }}"
            subject: "{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }}: {{ event.purefa_alert.summary }}"
            detail: >-
              component={{ event.purefa_alert.component_type }}:{{ event.purefa_alert.component_name }}
              expected={{ event.purefa_alert.expected }} actual={{ event.purefa_alert.actual }};
              action: {{ event.purefa_alert.action }} KB: {{ event.purefa_alert.knowledge_base_url }}
            target_array: "{{ event.purefa_alert.array }}"
            alert_id: "{{ event.purefa_alert.alert_id }}"
            alert_code: "{{ event.purefa_alert.code }}"
            alert_log: "{{ alert_log }}"

    - name: Alert closed - log
      condition: event.purefa_alert.transition == "closed"
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }} closed: {{ event.purefa_alert.summary }}"
            detail: "alert {{ event.purefa_alert.alert_id }} is {{ event.purefa_alert.state }}"
            target_array: "{{ event.purefa_alert.array }}"
            alert_id: "{{ event.purefa_alert.alert_id }}"
            alert_code: "{{ event.purefa_alert.code }}"
            alert_log: "{{ alert_log }}"
