---
# Health: hardware components whose status is an issue, drives that are not
# healthy, controller failover, maintenance windows, remote assist and the
# port connectivity of the hosts that have volumes.
#
# A hardware issue outside a maintenance window lights the component's
# identify LED (playbooks/identify_led.yml, everpure.flasharray.purefa_hardware)
# and records it to the alert log. Inside a maintenance window it only logs:
# someone is already working on the array.
#
# Actions:
#   hardware issue                     -> identify LED and record (log only in a window)
#   hardware recovered                 -> clear the identify LED
#   drive not healthy, controller failover -> notify (critical)
#   host paths critical                -> notify (critical, six-hourly per host,
#                                         outside a maintenance window)
#   host paths degraded                -> notify (warning, six-hourly per host,
#                                         outside a maintenance window)
#   host paths recovered               -> notify (info)

- name: FlashArray health
  hosts: all

  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: "{{ purefa_arrays }}"
        signals: [health]
        health_interval: "{{ health_interval }}"

  rules:
    # A poll that fails once is a blip; one that keeps failing is an array
    # nobody is watching. This is the reachability rulebook, so the first
    # failure of a streak pages at warning, once an hour per array; a streak
    # the plugin flags as escalated (poll_error_escalate, default 10 polls)
    # pages at critical once every six hours. Anything in between is logged
    # below. The other polling rulebooks record their first failure at info
    # (alert log only under the default Slack floor), so one unreachable
    # array is one page, not nine.
    - name: Poll failing for many polls - escalate
      condition: >-
        event.purefa_poll_error is defined and
        event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row"
            detail: "{{ event.purefa_poll_error.error }}"
            target_array: "{{ event.purefa_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Poll failed - notify once
      condition: >-
        event.purefa_poll_error is defined and
        event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed"
            detail: "{{ event.purefa_poll_error.error }}"
            target_array: "{{ event.purefa_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: "poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}"

    # The hour is per episode: a component back in the issue set after
    # recovering is a new episode, lit and recorded at once.
    - name: Hardware issue outside a maintenance window - identify LED and notify
      condition: >-
        event.purefa_hardware.status is defined and
        event.purefa_hardware.maintenance_active == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_hardware.array
          - event.purefa_hardware.component
          - event.purefa_hardware.episode
      action:
        run_playbook:
          name: playbooks/identify_led.yml
          extra_vars:
            target_array: "{{ event.purefa_hardware.array }}"
            component: "{{ event.purefa_hardware.component }}"
            component_type: "{{ event.purefa_hardware.type }}"
            component_status: "{{ event.purefa_hardware.status }}"
            component_details: "{{ event.purefa_hardware.details }}"
            led_state: true
            alert_log: "{{ alert_log }}"

    - name: Hardware issue during a maintenance window - log only
      condition: >-
        event.purefa_hardware.status is defined and
        event.purefa_hardware.maintenance_active == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_hardware.array
          - event.purefa_hardware.component
          - event.purefa_hardware.episode
      action:
        debug:
          msg: >-
            maintenance window active on {{ event.purefa_hardware.array }}:
            {{ event.purefa_hardware.component }} {{ event.purefa_hardware.status }} not actioned

    # A component that left the issue set has recovered: clear the identify
    # LED the rule above lit, when it is still lit; a maintenance window open
    # at the time changes nothing, the part reads healthy and the event comes
    # once.
    - name: Hardware recovered - clear the identify LED
      condition: >-
        event.purefa_hardware_recovered.component is defined and
        event.purefa_hardware_recovered.identify_enabled == true
      action:
        run_playbook:
          name: playbooks/identify_led.yml
          extra_vars:
            target_array: "{{ event.purefa_hardware_recovered.array }}"
            component: "{{ event.purefa_hardware_recovered.component }}"
            component_type: "{{ event.purefa_hardware_recovered.type }}"
            component_status: "{{ event.purefa_hardware_recovered.status }}"
            component_details: "recovered from {{ event.purefa_hardware_recovered.previous_status }}"
            led_state: false
            severity: info
            alert_log: "{{ alert_log }}"

    - name: Hardware recovered - log
      condition: event.purefa_hardware_recovered.component is defined
      action:
        debug:
          msg: >-
            {{ event.purefa_hardware_recovered.array }} {{ event.purefa_hardware_recovered.component }} recovered
            ({{ event.purefa_hardware_recovered.previous_status }} -> {{ event.purefa_hardware_recovered.status }});
            identify LED {{ 'left as it is' if event.purefa_hardware_recovered.identify_enabled else 'off' }}

    - name: Drive not healthy - notify
      condition: event.purefa_health.drive_issue_count is defined and event.purefa_health.drive_issue_count > 0
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_health.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "Drive issue on {{ event.purefa_health.array }}"
            detail: "{{ event.purefa_health.drive_issues }}"
            target_array: "{{ event.purefa_health.array }}"
            alert_log: "{{ alert_log }}"

    - name: Controller failover - notify
      condition: event.purefa_controller_failover.primary is defined
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "Controller failover on {{ event.purefa_controller_failover.array }}: primary is now {{ event.purefa_controller_failover.primary }}"
            detail: "previous primary {{ event.purefa_controller_failover.previous_primary }}; controllers {{ event.purefa_controller_failover.controllers }}"
            target_array: "{{ event.purefa_controller_failover.array }}"
            alert_log: "{{ alert_log }}"

    # Host port connectivity, for hosts with volumes (the plugin skips the
    # rest). Outside a maintenance window critical pages and any other status
    # warns; inside one both are silent, since fabric work degrades paths on
    # purpose. Six hours per host: paths flap while someone works on them.
    # The recovery event carries recovered: true, which both rules exclude,
    # so it is never held and always reaches its own rule.
    - name: Host paths critical - notify
      condition: >-
        event.purefa_host_connectivity.host is defined and
        event.purefa_host_connectivity.status == "critical" and
        event.purefa_host_connectivity.recovered == false and
        event.purefa_host_connectivity.maintenance_active == false
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_host_connectivity.array
          - event.purefa_host_connectivity.host
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "Host {{ event.purefa_host_connectivity.host }} on {{ event.purefa_host_connectivity.array }} has critical port connectivity"
            detail: >-
              {{ event.purefa_host_connectivity.details }};
              {{ event.purefa_host_connectivity.connection_count }} volumes connected,
              host group {{ event.purefa_host_connectivity.host_group }},
              personality {{ event.purefa_host_connectivity.personality }}
            target_array: "{{ event.purefa_host_connectivity.array }}"
            alert_log: "{{ alert_log }}"

    - name: Host paths degraded - notify
      condition: >-
        event.purefa_host_connectivity.host is defined and
        event.purefa_host_connectivity.recovered == false and
        event.purefa_host_connectivity.maintenance_active == false and
        event.purefa_host_connectivity.status != "healthy"
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_host_connectivity.array
          - event.purefa_host_connectivity.host
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "Host {{ event.purefa_host_connectivity.host }} on {{ event.purefa_host_connectivity.array }} has {{ event.purefa_host_connectivity.status }} port connectivity"
            detail: >-
              {{ event.purefa_host_connectivity.details }};
              {{ event.purefa_host_connectivity.connection_count }} volumes connected,
              host group {{ event.purefa_host_connectivity.host_group }},
              personality {{ event.purefa_host_connectivity.personality }}
            target_array: "{{ event.purefa_host_connectivity.array }}"
            alert_log: "{{ alert_log }}"

    - name: Host paths recovered - notify
      condition: >-
        event.purefa_host_connectivity.host is defined and
        event.purefa_host_connectivity.recovered == true
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "Host {{ event.purefa_host_connectivity.host }} on {{ event.purefa_host_connectivity.array }} port connectivity recovered"
            detail: >-
              status {{ event.purefa_host_connectivity.status }};
              {{ event.purefa_host_connectivity.connection_count }} volumes connected,
              host group {{ event.purefa_host_connectivity.host_group }}
            target_array: "{{ event.purefa_host_connectivity.array }}"
            alert_log: "{{ alert_log }}"

    - name: Maintenance window active - log
      condition: event.purefa_health.maintenance_active == true
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefa_health.array
      action:
        debug:
          msg: "maintenance window active on {{ event.purefa_health.array }}: {{ event.purefa_health.maintenance_windows }}"

    - name: Remote assist session open - log
      condition: event.purefa_health.remote_assist_active == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_health.array
      action:
        debug:
          msg: "remote assist is active on {{ event.purefa_health.array }}"
