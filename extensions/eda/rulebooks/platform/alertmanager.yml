---
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/alertmanager.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules take their place on
# the platform).
- name: FlashArray via Alertmanager
  hosts: all
  sources:
    - ansible.eda.alertmanager:
        host: '{{ alertmanager_host }}'
        port: '{{ alertmanager_port }}'
        data_alerts_path: alerts
        data_host_path: ''
        data_path_separator: .
  rules:
    - name: Hardware component not ok - identify LED and notify
      condition: event.alert.status == "firing" and event.alert.labels.alertname == "FlashArrayHardwareComponentNotOk"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.alert.labels.array_name
          - event.alert.labels.component_name
      action:
        run_job_template:
          name: FlashArray - identify LED
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.alert.labels.array_name }}'
              component: '{{ event.alert.labels.component_name }}'
              component_type: '{{ event.alert.labels.component_type | default('''') }}'
              component_status: not_ok
              component_details: '{{ event.alert.annotations.summary | default('''') }}'
              severity: '{{ event.alert.labels.severity | default(''critical'') }}'
              led_state: true
    - name: Capacity threshold - approval request
      condition: event.alert.status == "firing" and event.alert.labels.alertname == "FlashArrayCapacityHigh"
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.alert.labels.array_name
      action:
        run_job_template:
          name: FlashArray - capacity request
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              at_risk_array: '{{ event.alert.labels.array_name }}'
              used_pct: '{{ event.alert.annotations.value | default('''') }}'
              used_bytes: ''
              capacity_bytes: ''
    - name: Scrape failed - notify
      condition: event.alert.status == "firing" and event.alert.labels.alertname == "FlashArrayScrapeFailed"
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.instance
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.alert.labels.severity | default(''critical'') }}'
              subject: 'FlashArrayScrapeFailed: {{ event.alert.annotations.summary | default('''') }}'
              detail: instance={{ event.alert.labels.instance | default('') }} labels={{ event.alert.labels }}
              target_array: '{{ event.alert.labels.array_name | default(event.alert.labels.instance | default('''')) }}'
    - name: Any other firing FlashArray alert - notify
      condition: event.alert.status == "firing" and event.alert.labels.alertname is defined and event.alert.labels.alertname not in ["FlashArrayHardwareComponentNotOk", "FlashArrayCapacityHigh", "FlashArrayScrapeFailed"]
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.alert.labels.array_name
          - event.alert.labels.alertname
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.alert.labels.severity | default(''warning'') }}'
              subject: '{{ event.alert.labels.alertname }}: {{ event.alert.annotations.summary | default('''') }}'
              detail: domain={{ event.alert.labels.domain | default('') }} labels={{ event.alert.labels }}
              target_array: '{{ event.alert.labels.array_name | default(event.alert.labels.instance | default('''')) }}'
    - name: Resolved - log
      condition: event.alert.status == "resolved"
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: 'resolved: {{ event.alert.labels.alertname | default('''') }} on {{ event.alert.labels.array_name | default(event.alert.labels.instance | default('''')) }}'
              detail: '{{ event.alert.annotations.summary | default('''') }}'
              target_array: '{{ event.alert.labels.array_name | default(event.alert.labels.instance | default('''')) }}'
