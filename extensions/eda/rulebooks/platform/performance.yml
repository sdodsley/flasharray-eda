---
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/performance.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules take their place on
# the platform).
- name: FlashArray performance
  hosts: all
  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: '{{ purefa_arrays }}'
        signals:
          - telemetry
        telemetry_interval: '{{ telemetry_interval }}'
        latency_threshold_usec: '{{ hotspot_latency_usec }}'
        min_iops: '{{ hotspot_min_iops }}'
        top_volumes: 10
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}'
    - name: Noisy neighbour on a hot array - apply a temporary QoS cap
      condition: "event.purefa_volume_performance.high_latency_polls is defined and event.purefa_volume_performance.high_latency_polls >= vars.hotspot_consecutive_polls and event.purefa_volume_performance.iops_share_pct >= vars.qos_cap_min_iops_share_pct and event.purefa_volume_performance.eda_capped == false and event.purefa_volume_performance.volume_group_capped == false and (event.purefa_volume_performance.array_usec_per_read_op >= vars.array_hot_latency_usec or\n event.purefa_volume_performance.array_usec_per_write_op >= vars.array_hot_latency_usec) and\nvars.qos_auto_cap == true and (event.purefa_volume_performance.volume_group_qos == false or vars.qos_cap_scope != \"notify\")"
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefa_volume_performance.array
          - event.purefa_volume_performance.volume
      action:
        run_job_template:
          name: FlashArray - QoS cap
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefa_volume_performance.array }}'
              volume: '{{ event.purefa_volume_performance.volume }}'
              mode: cap
              cap_iops: '{{ qos_cap_iops }}'
              qos_cap_scope: '{{ qos_cap_scope }}'
              reason: read={{ event.purefa_volume_performance.usec_per_read_op }}us write={{ event.purefa_volume_performance.usec_per_write_op }}us iops={{ event.purefa_volume_performance.reads_per_sec }}r/{{ event.purefa_volume_performance.writes_per_sec }}w ({{ event.purefa_volume_performance.iops_share_pct }}% of the array) for {{ event.purefa_volume_performance.high_latency_polls }} polls; array read={{ event.purefa_volume_performance.array_usec_per_read_op }}us write={{ event.purefa_volume_performance.array_usec_per_write_op }}us
    - name: Noisy neighbour inside a volume group with its own QoS - notify
      condition: "event.purefa_volume_performance.high_latency_polls is defined and event.purefa_volume_performance.high_latency_polls >= vars.hotspot_consecutive_polls and event.purefa_volume_performance.iops_share_pct >= vars.qos_cap_min_iops_share_pct and event.purefa_volume_performance.eda_capped == false and event.purefa_volume_performance.volume_group_capped == false and (event.purefa_volume_performance.array_usec_per_read_op >= vars.array_hot_latency_usec or\n event.purefa_volume_performance.array_usec_per_write_op >= vars.array_hot_latency_usec) and\nvars.qos_auto_cap == true and event.purefa_volume_performance.volume_group_qos == true and vars.qos_cap_scope == \"notify\""
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefa_volume_performance.array
          - event.purefa_volume_performance.volume
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Noisy neighbour {{ event.purefa_volume_performance.array }}/{{ event.purefa_volume_performance.volume }} sits in volume group {{ event.purefa_volume_performance.volume_group }}, which has its own QoS
              detail: The array refuses a volume limit inside a rate-limited volume group, so no cap was applied. read={{ event.purefa_volume_performance.usec_per_read_op }}us write={{ event.purefa_volume_performance.usec_per_write_op }}us iops={{ event.purefa_volume_performance.reads_per_sec }}r/{{ event.purefa_volume_performance.writes_per_sec }}w ({{ event.purefa_volume_performance.iops_share_pct }}% of the array) for {{ event.purefa_volume_performance.high_latency_polls }} polls; array read={{ event.purefa_volume_performance.array_usec_per_read_op }}us write={{ event.purefa_volume_performance.array_usec_per_write_op }}us. Set qos_cap_scope to vgroup to cap the group instead.
              target_array: '{{ event.purefa_volume_performance.array }}'
    - name: Capped volume back to normal - lift the cap
      condition: event.purefa_volume_performance.eda_capped == true and event.purefa_volume_performance.normal_polls >= vars.qos_lift_normal_polls
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefa_volume_performance.array
          - event.purefa_volume_performance.volume
      action:
        run_job_template:
          name: FlashArray - QoS cap
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefa_volume_performance.array }}'
              volume: '{{ event.purefa_volume_performance.volume }}'
              mode: lift
              reason: latency normal for {{ event.purefa_volume_performance.normal_polls }} polls (capped since {{ event.purefa_volume_performance.eda_cap_since }})
    - name: Sustained volume latency on a hot array - notify
      condition: "event.purefa_volume_performance.high_latency_polls is defined and event.purefa_volume_performance.high_latency_polls >= vars.hotspot_consecutive_polls and (event.purefa_volume_performance.array_usec_per_read_op >= vars.array_hot_latency_usec or\n event.purefa_volume_performance.array_usec_per_write_op >= vars.array_hot_latency_usec) and\n(vars.qos_auto_cap == false or event.purefa_volume_performance.iops_share_pct < vars.qos_cap_min_iops_share_pct)"
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefa_volume_performance.array
          - event.purefa_volume_performance.volume
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Sustained latency on {{ event.purefa_volume_performance.array }}/{{ event.purefa_volume_performance.volume }}
              detail: read={{ event.purefa_volume_performance.usec_per_read_op }}us write={{ event.purefa_volume_performance.usec_per_write_op }}us iops={{ event.purefa_volume_performance.reads_per_sec }}r/{{ event.purefa_volume_performance.writes_per_sec }}w ({{ event.purefa_volume_performance.iops_share_pct }}% of the array) for {{ event.purefa_volume_performance.high_latency_polls }} polls; array read={{ event.purefa_volume_performance.array_usec_per_read_op }}us write={{ event.purefa_volume_performance.array_usec_per_write_op }}us
              target_array: '{{ event.purefa_volume_performance.array }}'
    - name: Array write latency well above the same time last week - notify
      condition: event.purefa_array_performance.baseline_known == true and event.purefa_array_performance.write_latency_ratio >= vars.baseline_latency_ratio and event.purefa_array_performance.usec_per_write_op >= vars.array_hot_latency_usec
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefa_array_performance.array
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ event.purefa_array_performance.array }} write latency is {{ event.purefa_array_performance.write_latency_ratio }}x last week''s'
              detail: now write={{ event.purefa_array_performance.usec_per_write_op }}us iops={{ event.purefa_array_performance.writes_per_sec }}; same half hour last week write={{ event.purefa_array_performance.baseline_usec_per_write_op }}us iops={{ event.purefa_array_performance.baseline_writes_per_sec }}
              target_array: '{{ event.purefa_array_performance.array }}'
