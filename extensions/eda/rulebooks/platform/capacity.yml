---
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/capacity.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules take their place on
# the platform).
- name: FlashArray capacity
  hosts: all
  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: '{{ purefa_arrays }}'
        signals:
          - telemetry
        telemetry_interval: '{{ telemetry_interval }}'
        top_growers: 5
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}'
    - name: Array over capacity risk threshold - raise an approval request
      condition: event.purefa_capacity.used_pct is defined and event.purefa_capacity.used_pct >= vars.capacity_risk_pct and vars.orchestrator_enabled == false
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_capacity.array
      action:
        run_job_template:
          name: FlashArray - capacity request
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              at_risk_array: '{{ event.purefa_capacity.array }}'
              request_key: '{{ event.meta.received_at | default('''') }}'
              used_pct: '{{ event.purefa_capacity.used_pct }}'
              used_bytes: '{{ event.purefa_capacity.used_bytes }}'
              capacity_bytes: '{{ event.purefa_capacity.capacity_bytes }}'
              days_to_full: '{{ event.purefa_capacity.days_to_full }}'
              top_growers: '{{ event.purefa_capacity.top_growers }}'
              pending_eradication_volumes: '{{ event.purefa_capacity.pending_eradication_volumes }}'
              pending_eradication_snapshots: '{{ event.purefa_capacity.pending_eradication_snapshots }}'
              candidate_targets: '{{ event.purefa_capacity.others }}'
    - name: Array over capacity risk threshold - hand the event to the orchestrator
      condition: event.purefa_capacity.used_pct is defined and event.purefa_capacity.used_pct >= vars.capacity_risk_pct and vars.orchestrator_enabled == true
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_capacity.array
      action:
        run_job_template:
          name: FlashArray - orchestrator post
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              orchestrator_url: '{{ orchestrator_url }}'
              orchestrator_webhook_path: '{{ orchestrator_paths.capacity }}'
              orchestrator_validate_certs: '{{ orchestrator_validate_certs }}'
              event: '{{ event }}'
              array: '{{ event.purefa_capacity.array }}'
              orchestrator_fallback_local: '{{ orchestrator_fallback_local }}'
    - name: Array will be full within the warning horizon - notify
      condition: event.purefa_capacity.days_to_full_known == true and event.purefa_capacity.days_to_full <= vars.capacity_days_to_full_warning
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_capacity.array
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ event.purefa_capacity.array }} full in about {{ event.purefa_capacity.days_to_full }} days at the 7-day growth rate'
              detail: used={{ event.purefa_capacity.used_pct }}% growth={{ event.purefa_capacity.growth_bytes_per_day }} bytes/day top growers={{ event.purefa_capacity.top_growers }}
              target_array: '{{ event.purefa_capacity.array }}'
