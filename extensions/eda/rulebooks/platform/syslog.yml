---
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/syslog.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules take their place on
# the platform).
- name: FlashArray syslog
  hosts: all
  sources:
    - sdodsley.flasharray_eda.purefa_syslog:
        host: '{{ syslog_host }}'
        port: '{{ syslog_port }}'
        allowed_sources: '{{ syslog_allowed_sources }}'
        programs: '{{ syslog_programs }}'
        automation_users: '{{ automation_users }}'
        arrays: '{{ syslog_hostnames }}'
  rules:
    - name: Alert via syslog - notify
      condition: event.purefa_syslog.kind == "alert"
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefa_syslog.array
          - event.purefa_syslog.message
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ ''critical'' if event.purefa_syslog.severity in [''emerg'', ''alert'', ''crit'', ''err''] else (''info'' if event.purefa_syslog.severity in [''notice'', ''info'', ''debug''] else ''warning'') }}'
              subject: '{{ event.purefa_syslog.array }} alert{{ ('' '' ~ event.purefa_syslog.fields.code) if event.purefa_syslog.fields.code is defined else '''' }}: {{ event.purefa_syslog.fields.subject | default(event.purefa_syslog.message) }}'
              detail: '{{ event.purefa_syslog.fields.description | default('''') }} {{ (''KB '' ~ event.purefa_syslog.fields.knowledge_base_url) if event.purefa_syslog.fields.knowledge_base_url is defined else '''' }} (syslog {{ event.purefa_syslog.severity }} from {{ event.purefa_syslog.source }}, {{ event.purefa_syslog.fields.utc_time | default(event.purefa_syslog.time) }} UTC)'
              alert_code: '{{ event.purefa_syslog.fields.code | default('''') }}'
              target_array: '{{ event.purefa_syslog.array }}'
    - name: Human action via syslog audit - fast notification
      condition: event.purefa_syslog.kind == "audit" and event.purefa_syslog.by_automation == false and event.purefa_syslog.fields.user is defined and event.purefa_syslog.fields.action is defined and event.purefa_syslog.fields.message_kind != "login"
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefa_syslog.user }} on {{ event.purefa_syslog.array }}: {{ event.purefa_syslog.action }}'
              detail: '{{ event.purefa_syslog.fields }}'
              target_array: '{{ event.purefa_syslog.array }}'
    - name: Test message - record
      condition: event.purefa_syslog.kind == "test"
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefa_syslog.array }}: syslog test line received'
              detail: 'purity.test from {{ event.purefa_syslog.source }}, array time {{ event.purefa_syslog.fields.utc_time | default(event.purefa_syslog.time) }} UTC, received {{ event.meta.received_at }}: {{ event.purefa_syslog.message }}'
              target_array: '{{ event.purefa_syslog.array }}'
    - name: Anything else from the array - log
      condition: event.purefa_syslog.kind == "other"
      action:
        debug:
          msg: 'unparsed syslog from {{ event.purefa_syslog.source }}: {{ event.purefa_syslog.raw }}'
