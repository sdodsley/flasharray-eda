---
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/health.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only rulesets left out (event streams or the controller workflow
# take their place on the platform).
- name: FlashArray health
  hosts: all
  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: '{{ purefa_arrays }}'
        signals:
          - health
        health_interval: '{{ health_interval }}'
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}'
    - name: Hardware issue outside a maintenance window - identify LED and notify
      condition: event.purefa_hardware.status is defined and event.purefa_hardware.maintenance_active == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_hardware.array
          - event.purefa_hardware.component
      action:
        run_job_template:
          name: FlashArray - identify LED
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefa_hardware.array }}'
              component: '{{ event.purefa_hardware.component }}'
              component_type: '{{ event.purefa_hardware.type }}'
              component_status: '{{ event.purefa_hardware.status }}'
              component_details: '{{ event.purefa_hardware.details }}'
              led_state: true
    - name: Hardware issue during a maintenance window - log only
      condition: event.purefa_hardware.status is defined and event.purefa_hardware.maintenance_active == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_hardware.array
          - event.purefa_hardware.component
      action:
        debug:
          msg: 'maintenance window active on {{ event.purefa_hardware.array }}: {{ event.purefa_hardware.component }} {{ event.purefa_hardware.status }} not actioned'
    - name: Drive not healthy - notify
      condition: event.purefa_health.drive_issue_count is defined and event.purefa_health.drive_issue_count > 0
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_health.array
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: Drive issue on {{ event.purefa_health.array }}
              detail: '{{ event.purefa_health.drive_issues }}'
              target_array: '{{ event.purefa_health.array }}'
    - name: Controller failover - notify
      condition: event.purefa_controller_failover.primary is defined
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: 'Controller failover on {{ event.purefa_controller_failover.array }}: primary is now {{ event.purefa_controller_failover.primary }}'
              detail: previous primary {{ event.purefa_controller_failover.previous_primary }}; controllers {{ event.purefa_controller_failover.controllers }}
              target_array: '{{ event.purefa_controller_failover.array }}'
    - name: Maintenance window active - log
      condition: event.purefa_health.maintenance_active == true
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefa_health.array
      action:
        debug:
          msg: 'maintenance window active on {{ event.purefa_health.array }}: {{ event.purefa_health.maintenance_windows }}'
    - name: Remote assist session open - log
      condition: event.purefa_health.remote_assist_active == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_health.array
      action:
        debug:
          msg: remote assist is active on {{ event.purefa_health.array }}
