---
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/alerts.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only rulesets left out (event streams or the controller workflow
# take their place on the platform).
- name: FlashArray alerts
  hosts: all
  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: '{{ purefa_arrays }}'
        signals:
          - alerts
        alerts_interval: '{{ alerts_interval }}'
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}'
    - name: Alert already open at start-up - log only
      condition: event.purefa_alert.transition == "initial"
      action:
        debug:
          msg: 'open at start: {{ event.purefa_alert.array }} #{{ event.purefa_alert.alert_id }} code {{ event.purefa_alert.code }} {{ event.purefa_alert.severity }} {{ event.purefa_alert.summary }}'
    - name: Alert opened during a maintenance window - log only
      condition: event.purefa_alert.transition == "opened" and event.purefa_alert.maintenance_active == true
      action:
        debug:
          msg: 'maintenance window on {{ event.purefa_alert.array }}: alert {{ event.purefa_alert.code }} {{ event.purefa_alert.summary }} not routed'
    - name: Alert opened and resolved between polls - notify
      condition: event.purefa_alert.transition == "opened" and event.purefa_alert.state == "closing"
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.purefa_alert.severity_down }}'
              subject: '{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }} opened and resolved: {{ event.purefa_alert.summary }}'
              detail: open for {{ event.purefa_alert.resolved_after_s }} s and resolved before the loop saw it open; {{ event.purefa_alert.action }}
              target_array: '{{ event.purefa_alert.array }}'
              alert_id: '{{ event.purefa_alert.alert_id }}'
              alert_code: '{{ event.purefa_alert.code }}'
    - name: Alert opened - route through the runbook map
      condition: event.purefa_alert.transition == "opened" and event.purefa_alert.maintenance_active == false
      action:
        run_job_template:
          name: FlashArray - alert runbook
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.purefa_alert.severity }}'
              transition: opened
              subject: '{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }}: {{ event.purefa_alert.summary }}'
              component: '{{ event.purefa_alert.component_type }}:{{ event.purefa_alert.component_name }}'
              array_action: '{{ event.purefa_alert.action }}'
              knowledge_base_url: '{{ event.purefa_alert.knowledge_base_url }}'
              target_array: '{{ event.purefa_alert.array }}'
              alert_id: '{{ event.purefa_alert.alert_id }}'
              alert_code: '{{ event.purefa_alert.code }}'
              alert_runbooks: '{{ alert_runbooks }}'
              alert_runbooks_by_type: '{{ alert_runbooks_by_type | default({}) }}'
              component_type: '{{ event.purefa_alert.component_type }}'
              baseline_ntp_servers_csv: '{{ baseline_ntp_servers_csv | default('''') }}'
    - name: Alert severity raised - route through the runbook map again
      condition: event.purefa_alert.transition == "updated" and event.purefa_alert.severity_raised == true and event.purefa_alert.maintenance_active == false
      action:
        run_job_template:
          name: FlashArray - alert runbook
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.purefa_alert.severity }}'
              transition: updated
              previous_severity: '{{ event.purefa_alert.previous_severity }}'
              subject: '{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }}: {{ event.purefa_alert.summary }}'
              component: '{{ event.purefa_alert.component_type }}:{{ event.purefa_alert.component_name }}'
              array_action: '{{ event.purefa_alert.action }}'
              knowledge_base_url: '{{ event.purefa_alert.knowledge_base_url }}'
              target_array: '{{ event.purefa_alert.array }}'
              alert_id: '{{ event.purefa_alert.alert_id }}'
              alert_code: '{{ event.purefa_alert.code }}'
              alert_runbooks: '{{ alert_runbooks }}'
              alert_runbooks_by_type: '{{ alert_runbooks_by_type | default({}) }}'
              component_type: '{{ event.purefa_alert.component_type }}'
              baseline_ntp_servers_csv: '{{ baseline_ntp_servers_csv | default('''') }}'
    - name: Alert reopened during a maintenance window - log only
      condition: event.purefa_alert.transition == "reopened" and event.purefa_alert.maintenance_active == true
      action:
        debug:
          msg: 'reopened during maintenance: {{ event.purefa_alert.array }} #{{ event.purefa_alert.alert_id }} code {{ event.purefa_alert.code }} {{ event.purefa_alert.severity }} {{ event.purefa_alert.summary }}'
    - name: Alert reopened - route through the runbook map again
      condition: event.purefa_alert.transition == "reopened" and event.purefa_alert.maintenance_active == false
      action:
        run_job_template:
          name: FlashArray - alert runbook
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.purefa_alert.severity }}'
              transition: reopened
              subject: '{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }} is back: {{ event.purefa_alert.summary }}'
              component: '{{ event.purefa_alert.component_type }}:{{ event.purefa_alert.component_name }}'
              array_action: '{{ event.purefa_alert.action }}'
              knowledge_base_url: '{{ event.purefa_alert.knowledge_base_url }}'
              target_array: '{{ event.purefa_alert.array }}'
              alert_id: '{{ event.purefa_alert.alert_id }}'
              alert_code: '{{ event.purefa_alert.code }}'
              alert_runbooks: '{{ alert_runbooks }}'
              alert_runbooks_by_type: '{{ alert_runbooks_by_type | default({}) }}'
              component_type: '{{ event.purefa_alert.component_type }}'
              baseline_ntp_servers_csv: '{{ baseline_ntp_servers_csv | default('''') }}'
    - name: Alert resolved - notify
      condition: event.purefa_alert.transition == "closing"
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: '{{ event.purefa_alert.severity_down }}'
              subject: '{{ event.purefa_alert.array }} alert {{ event.purefa_alert.code }} resolved: {{ event.purefa_alert.summary }}'
              detail: open for {{ event.purefa_alert.resolved_after_s }} s; {{ event.purefa_alert.action }}
              target_array: '{{ event.purefa_alert.array }}'
              alert_id: '{{ event.purefa_alert.alert_id }}'
              alert_code: '{{ event.purefa_alert.code }}'
    - name: Alert closed - log
      condition: event.purefa_alert.transition == "closed"
      action:
        debug:
          msg: 'closed: {{ event.purefa_alert.array }} #{{ event.purefa_alert.alert_id }} code {{ event.purefa_alert.code }} (a resolved alert reads closed a day after closing; the resolved notice went out then)'
