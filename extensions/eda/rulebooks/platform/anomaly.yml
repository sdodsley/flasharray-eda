---
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/anomaly.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules take their place on
# the platform).
- name: FlashArray anomaly
  hosts: all
  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: '{{ purefa_arrays }}'
        signals:
          - telemetry
          - audits
        telemetry_interval: '{{ telemetry_interval }}'
        audits_interval: '{{ audits_interval }}'
        automation_users: '{{ automation_users }}'
        drr_drop_threshold_pct: '{{ anomaly_drr_drop_pct }}'
        snapshot_growth_threshold_pct: '{{ anomaly_snapshot_growth_pct }}'
        write_surge_ratio: '{{ anomaly_write_surge_ratio }}'
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}'
    - name: Data reduction drop + snapshot or write surge + destructive snapshot change - protect now
      condition:
        all:
          - events.cap << event.purefa_capacity.drr_drop == true
          - events.surge << (event.purefa_capacity.snapshot_surge == true and event.purefa_capacity.array == events.cap.purefa_capacity.array) or (event.purefa_array_performance.write_surge == true and event.purefa_array_performance.array == events.cap.purefa_capacity.array)
          - events.audit << event.purefa_audit.command in ["puresnap", "purepgroup", "purevol"] and event.purefa_audit.subcommand in ["destroy", "eradicate", "setattr", "retain"] and event.purefa_audit.by_automation == false and event.purefa_audit.array == events.cap.purefa_capacity.array
        timeout: 15 minutes
      action:
        run_job_template:
          name: FlashArray - protect now
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ events.cap.purefa_capacity.array }}'
              drr_drop_pct: '{{ events.cap.purefa_capacity.drr_drop_pct }}'
              snapshot_growth_pct: '{{ events.cap.purefa_capacity.snapshot_growth_pct }}'
              audit_user: '{{ events.audit.purefa_audit.user }}'
              audit_command: '{{ events.audit.purefa_audit.command }} {{ events.audit.purefa_audit.subcommand }} {{ events.audit.purefa_audit.arguments }}'
              extend_eradication_by_s: '{{ anomaly_extend_eradication_by_s }}'
