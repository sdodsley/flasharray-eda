---
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/config_drift.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only and tick-only rulesets left out (event streams, the
# controller workflow and the controller's schedules take their place on
# the platform).
- name: FlashArray config drift
  hosts: all
  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: '{{ config_arrays | default(purefa_arrays) }}'
        signals:
          - config
        config_interval: '{{ config_interval }}'
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ (event.purefa_poll_error.array ~ '' '' ~ event.purefa_poll_error.signal ~ '' poll has failed '' ~ event.purefa_poll_error.consecutive ~ '' times in a row'') | pprint }}'
              detail: '{{ event.purefa_poll_error.error | pprint }}'
              target_array: '{{ event.purefa_poll_error.array | pprint }}'
    - name: Poll failed - notify once
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ (event.purefa_poll_error.array ~ '' '' ~ event.purefa_poll_error.signal ~ '' poll failed'') | pprint }}'
              detail: '{{ event.purefa_poll_error.error | pprint }}'
              target_array: '{{ event.purefa_poll_error.array | pprint }}'
    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}'
    - name: NTP drift - reapply baseline
      condition: event.purefa_config.ntp_servers_csv is defined and event.purefa_config.ntp_servers_csv != vars.baseline_ntp_servers_csv
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefa_config.array
      action:
        run_job_template:
          name: FlashArray - remediate NTP
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefa_config.array | pprint }}'
              observed_ntp_servers: '{{ event.purefa_config.ntp_servers_csv | pprint }}'
              baseline_ntp_servers_csv: '{{ baseline_ntp_servers_csv }}'
    - name: DNS drift - reapply baseline
      condition: "event.purefa_config.dns_nameservers_csv is defined and (event.purefa_config.dns_nameservers_csv != vars.baseline_dns_nameservers_csv or\n event.purefa_config.dns_domain != vars.baseline_dns_domain)"
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefa_config.array
      action:
        run_job_template:
          name: FlashArray - remediate DNS
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefa_config.array | pprint }}'
              observed_dns_domain: '{{ event.purefa_config.dns_domain | pprint }}'
              observed_dns_nameservers: '{{ event.purefa_config.dns_nameservers_csv | pprint }}'
              baseline_dns_domain: '{{ baseline_dns_domain }}'
              baseline_dns_nameservers_csv: '{{ baseline_dns_nameservers_csv }}'
    - name: LDAP drift - notify only
      condition: "event.purefa_config.ldap_uris_csv is defined and (event.purefa_config.ldap_uris_csv != vars.baseline_ldap_uris_csv or\n event.purefa_config.ldap_base_dn != vars.baseline_ldap_base_dn or\n event.purefa_config.ldap_enabled != vars.baseline_ldap_enabled)"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_config.array
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: LDAP configuration drift on {{ event.purefa_config.array }}
              detail: enabled={{ event.purefa_config.ldap_enabled }} uris={{ event.purefa_config.ldap_uris_csv }} base_dn={{ event.purefa_config.ldap_base_dn }}; baseline enabled={{ baseline_ldap_enabled }} uris={{ baseline_ldap_uris_csv }} base_dn={{ baseline_ldap_base_dn }}
              target_array: '{{ event.purefa_config.array | pprint }}'
    - name: SafeMode / eradication drift - notify only, never remediate
      condition: "event.purefa_config.manual_eradication is defined and (event.purefa_config.manual_eradication != vars.baseline_manual_eradication or\n event.purefa_config.eradication_delay_ms < vars.baseline_min_eradication_delay_ms)"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_config.array
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: SafeMode / eradication settings changed on {{ event.purefa_config.array }}
              detail: manual_eradication={{ event.purefa_config.manual_eradication }} eradication_delay_ms={{ event.purefa_config.eradication_delay_ms }}; baseline manual_eradication={{ baseline_manual_eradication }} minimum delay={{ baseline_min_eradication_delay_ms }}
              target_array: '{{ event.purefa_config.array | pprint }}'
    - name: Admin authentication settings drift - notify only
      condition: "event.purefa_config.max_login_attempts is defined and (event.purefa_config.max_login_attempts != vars.baseline_max_login_attempts or\n event.purefa_config.lockout_duration_ms != vars.baseline_lockout_duration_ms or\n event.purefa_config.min_password_length < vars.baseline_min_password_length or\n event.purefa_config.sso_enabled != vars.baseline_sso_enabled)"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_config.array
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Admin authentication settings drift on {{ event.purefa_config.array }}
              detail: max_login_attempts={{ event.purefa_config.max_login_attempts }} (baseline {{ baseline_max_login_attempts }}) lockout_duration_ms={{ event.purefa_config.lockout_duration_ms }} (baseline {{ baseline_lockout_duration_ms }}) min_password_length={{ event.purefa_config.min_password_length }} (baseline at least {{ baseline_min_password_length }}) sso_enabled={{ event.purefa_config.sso_enabled }} (baseline {{ baseline_sso_enabled }})
              target_array: '{{ event.purefa_config.array | pprint }}'
    - name: Certificate about to expire or expired - notify
      condition: event.purefa_certificate.days_left is defined and event.purefa_certificate.days_left <= vars.certificate_critical_days
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_certificate.array
          - event.purefa_certificate.name
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: Certificate {{ event.purefa_certificate.name }} on {{ event.purefa_certificate.array }} {{ 'has expired' if event.purefa_certificate.days_left < 0 else 'expires in ' ~ event.purefa_certificate.days_left ~ ' days' }}
              detail: '{{ (event.purefa_certificate.certificate_type ~ '' certificate ('' ~ event.purefa_certificate.status ~ '') issued to '' ~ event.purefa_certificate.issued_to ~ '', CN '' ~ event.purefa_certificate.common_name ~ '', valid to '' ~ event.purefa_certificate.valid_to ~ ''; critical within '' ~ certificate_critical_days ~ '' days'') | pprint }}'
              target_array: '{{ event.purefa_certificate.array | pprint }}'
    - name: Certificate expiring - notify
      condition: event.purefa_certificate.days_left is defined and event.purefa_certificate.days_left <= vars.certificate_warn_days
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_certificate.array
          - event.purefa_certificate.name
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Certificate {{ event.purefa_certificate.name }} on {{ event.purefa_certificate.array }} expires in {{ event.purefa_certificate.days_left }} days
              detail: '{{ (event.purefa_certificate.certificate_type ~ '' certificate ('' ~ event.purefa_certificate.status ~ '') issued to '' ~ event.purefa_certificate.issued_to ~ '', CN '' ~ event.purefa_certificate.common_name ~ '', valid to '' ~ event.purefa_certificate.valid_to ~ ''; warning within '' ~ certificate_warn_days ~ '' days'') | pprint }}'
              target_array: '{{ event.purefa_certificate.array | pprint }}'
    - name: KMIP server unreachable - notify
      condition: event.purefa_kmip.name is defined and event.purefa_kmip.ok == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_kmip.array
          - event.purefa_kmip.name
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: KMIP server {{ event.purefa_kmip.name }} on {{ event.purefa_kmip.array }} failed the array's test
              detail: 'uris={{ event.purefa_kmip.uris }}; failures: {{ event.purefa_kmip.failures }}'
              target_array: '{{ event.purefa_kmip.array | pprint }}'
    - name: No enabled alert watcher - notify
      condition: vars.alert_watchers_required == true and event.purefa_config.alert_watchers_enabled_count is defined and event.purefa_config.alert_watchers_enabled_count == 0
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_config.array
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: No enabled alert watcher on {{ event.purefa_config.array }}
              detail: '{{ (event.purefa_config.alert_watcher_count ~ '' watchers configured, none enabled: '' ~ event.purefa_config.alert_watchers_csv) | pprint }}'
              target_array: '{{ event.purefa_config.array | pprint }}'
    - name: Alert watchers differ from the baseline - notify
      condition: vars.baseline_alert_watchers_csv != "" and event.purefa_config.alert_watchers_csv is defined and event.purefa_config.alert_watchers_csv != vars.baseline_alert_watchers_csv
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_config.array
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: Alert watchers on {{ event.purefa_config.array }} differ from the baseline
              detail: watchers={{ event.purefa_config.alert_watchers_csv }} (enabled {{ event.purefa_config.alert_watchers_enabled_csv }}); baseline {{ baseline_alert_watchers_csv }}
              target_array: '{{ event.purefa_config.array | pprint }}'
