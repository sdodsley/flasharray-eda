---
# Generated by tools/platform_rulebooks.py from
# extensions/eda/rulebooks/change_control.yml; edit that file and regenerate with
#   python tools/platform_rulebooks.py
# The rulesets, sources and rules are the standalone rulebook's, with every
# run_playbook turned into run_job_template against the job template
# aap/seed.yml creates for that playbook (organization aap_organization;
# alert_log, request_dir and baseline_dir come from the templates), the
# project's event sources named by their collection FQCN, and the
# webhook-only rulesets left out (event streams or the controller workflow
# take their place on the platform).
- name: FlashArray change control
  hosts: all
  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: '{{ config_arrays | default(purefa_arrays) }}'
        signals:
          - audits
        audits_interval: '{{ audits_interval }}'
        automation_users: '{{ automation_users }}'
  rules:
    - name: Poll failing for many polls - escalate
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: critical
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Poll failed - notify once
      condition: event.purefa_poll_error is defined and event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: info
              subject: '{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed'
              detail: '{{ event.purefa_poll_error.error }}'
              target_array: '{{ event.purefa_poll_error.array }}'
    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: 'poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}'
    - name: Governed setting changed by a human - reconcile from the baseline
      condition: event.purefa_audit.command is defined and event.purefa_audit.command in vars.governed_commands and event.purefa_audit.by_automation == false and event.purefa_audit.system_user == false and event.purefa_audit.maintenance_active == false
      throttle:
        once_within: 2 minutes
        group_by_attributes:
          - event.purefa_audit.array
          - event.purefa_audit.command
      action:
        run_job_template:
          name: FlashArray - reconcile
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              target_array: '{{ event.purefa_audit.array }}'
              audit_user: '{{ event.purefa_audit.user }}'
              audit_interface: '{{ event.purefa_audit.user_interface }}'
              audit_command: '{{ event.purefa_audit.command }}'
              audit_subcommand: '{{ event.purefa_audit.subcommand }}'
              audit_arguments: '{{ event.purefa_audit.arguments }}'
              audit_time: '{{ event.purefa_audit.time }}'
    - name: Governed setting changed during a maintenance window - log only
      condition: event.purefa_audit.command is defined and event.purefa_audit.command in vars.governed_commands and event.purefa_audit.by_automation == false and event.purefa_audit.maintenance_active == true
      action:
        debug:
          msg: 'maintenance window on {{ event.purefa_audit.array }}: {{ event.purefa_audit.user }} ran {{ event.purefa_audit.command }} {{ event.purefa_audit.subcommand }} {{ event.purefa_audit.arguments }}; not reconciled'
    - name: Destructive command by a human - notify
      condition: event.purefa_audit.command is defined and event.purefa_audit.command in vars.destructive_commands and event.purefa_audit.subcommand in vars.destructive_subcommands and event.purefa_audit.by_automation == false and event.purefa_audit.system_user == false
      action:
        run_job_template:
          name: FlashArray - notify
          organization: '{{ aap_organization }}'
          job_args:
            extra_vars:
              severity: warning
              subject: '{{ event.purefa_audit.user }} ran {{ event.purefa_audit.command }} {{ event.purefa_audit.subcommand }} on {{ event.purefa_audit.array }}'
              detail: 'arguments: {{ event.purefa_audit.arguments }} (interface {{ event.purefa_audit.user_interface }}, audit {{ event.purefa_audit.audit_id }})'
              target_array: '{{ event.purefa_audit.array }}'
    - name: Change by the automation account - log
      condition: event.purefa_audit.by_automation == true
      action:
        debug:
          msg: 'automation ({{ event.purefa_audit.user }}) on {{ event.purefa_audit.array }}: {{ event.purefa_audit.command }} {{ event.purefa_audit.subcommand }} {{ event.purefa_audit.arguments }}'
