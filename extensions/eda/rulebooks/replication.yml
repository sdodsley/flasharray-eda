---
# Replication as an RPO contract: array connections and their paths, pod
# replica links (lag, recovery point, pause), stretched pods (ActiveCluster
# member and mediator status) and protection group replication (overdue or
# stuck transfers), plus a scheduled DR drill.
#
# Actions (each gated by a var so a site can start with notify only):
#   overdue or stuck protection group  -> replicate now (purefa_pgsnap remote: true,
#                                         an immediate replicated snapshot)
#   stretched pod member offline       -> move host preferred arrays to the
#                                         online side; move them back on recovery
#   RPO breached for N polls           -> escalate to critical
#   paused link, failed paths, unhealthy link -> notify
#   tick                               -> DR drill: copy a volume from the latest
#                                         replicated snapshot on the target,
#                                         verify, destroy

- name: FlashArray replication
  hosts: all

  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: "{{ purefa_arrays }}"
        signals: [replication]
        replication_interval: "{{ replication_interval }}"
        rpo_seconds: "{{ rpo_seconds }}"
        stuck_transfer_polls: 3

  rules:
    # A poll that fails once is a blip; one that keeps failing is an array
    # nobody is watching. The first failure of a streak is recorded at info
    # (the alert log; under the default Slack floor), once an hour per array
    # and signal, because health.yml already pages for the array itself and
    # eight rulebooks poll the same arrays; a streak the plugin flags as
    # escalated (poll_error_escalate, default 10 polls) pages at critical once
    # every six hours, since a signal that fails on its own is worth a page.
    # Anything in between is logged below.
    - name: Poll failing for many polls - escalate
      condition: >-
        event.purefa_poll_error is defined and
        event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row"
            detail: "{{ event.purefa_poll_error.error }}"
            target_array: "{{ event.purefa_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Poll failed - notify once
      condition: >-
        event.purefa_poll_error is defined and
        event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed"
            detail: "{{ event.purefa_poll_error.error }}"
            target_array: "{{ event.purefa_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: "poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}"

    - name: Array connection not connected - notify
      condition: >-
        event.purefa_array_connection.status is defined and
        event.purefa_array_connection.status != "connected"
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefa_array_connection.array
          - event.purefa_array_connection.remote
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: >-
              {{ event.purefa_array_connection.array }} connection to {{ event.purefa_array_connection.remote }}
              is {{ event.purefa_array_connection.status }}
            detail: >-
              type={{ event.purefa_array_connection.type }}
              paths {{ event.purefa_array_connection.paths_connected }}/{{ event.purefa_array_connection.paths_total }} connected;
              failed: {{ event.purefa_array_connection.failed_paths }}
            target_array: "{{ event.purefa_array_connection.array }}"
            alert_log: "{{ alert_log }}"

    - name: Array connection has failed paths - notify with the paths
      condition: >-
        event.purefa_array_connection.status == "connected" and
        event.purefa_array_connection.paths_connected < event.purefa_array_connection.paths_total
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_array_connection.array
          - event.purefa_array_connection.remote
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "{{ event.purefa_array_connection.array }} has failed replication paths to {{ event.purefa_array_connection.remote }}"
            detail: >-
              {{ event.purefa_array_connection.paths_connected }} of {{ event.purefa_array_connection.paths_total }} paths connected;
              failed: {{ event.purefa_array_connection.failed_paths }}
            target_array: "{{ event.purefa_array_connection.array }}"
            alert_log: "{{ alert_log }}"

    # A planned switchover tags the source pod eda/planned_work before it
    # demotes (dr_switchover.yml); the plugin stamps planned: true on the
    # link's events from both arrays while the tag is fresh (a demoted pod
    # cannot take a tag, so the target side is marked through the source);
    # the link then reads quiescing,
    # quiesced and paused on purpose, so those events are logged here and
    # never reach the notify rules below (the first matching rule wins).
    - name: Replica link changing during planned work - log only
      condition: event.purefa_replica_link.planned == true
      action:
        debug:
          msg: >-
            planned work on {{ event.purefa_replica_link.array }}/{{ event.purefa_replica_link.local_pod }}
            ({{ event.purefa_replica_link.planned_note }}): link {{ event.purefa_replica_link.status }}
            paused={{ event.purefa_replica_link.paused }}, not paged

    - name: Replica link paused - notify
      condition: event.purefa_replica_link.paused == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_replica_link.array
          - event.purefa_replica_link.local_pod
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: >-
              Replica link {{ event.purefa_replica_link.local_pod }} ->
              {{ event.purefa_replica_link.remote_array }}:{{ event.purefa_replica_link.remote_pod }} is paused
            detail: >-
              status={{ event.purefa_replica_link.status }} paused for {{ event.purefa_replica_link.paused_for_s }}s
              (since this rulebook noticed), recovery point {{ event.purefa_replica_link.recovery_point_age_s }}s old
            target_array: "{{ event.purefa_replica_link.array }}"
            alert_log: "{{ alert_log }}"

    - name: Replica link unhealthy - notify
      condition: >-
        event.purefa_replica_link.status is defined and
        event.purefa_replica_link.status in ["unhealthy", "quiescing", "quiesced"]
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefa_replica_link.array
          - event.purefa_replica_link.local_pod
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: >-
              Replica link {{ event.purefa_replica_link.local_pod }} -> {{ event.purefa_replica_link.remote_pod }}
              is {{ event.purefa_replica_link.status }}
            detail: >-
              direction={{ event.purefa_replica_link.direction }} lag={{ event.purefa_replica_link.lag_ms }}ms
              recovery point {{ event.purefa_replica_link.recovery_point_age_s }}s old
            target_array: "{{ event.purefa_replica_link.array }}"
            alert_log: "{{ alert_log }}"

    - name: Replica link lag above the RPO - notify
      condition: >-
        event.purefa_replica_link.direction == "outbound" and
        event.purefa_replica_link.rpo_breached == true and
        event.purefa_replica_link.rpo_breach_polls < vars.rpo_escalate_polls
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefa_replica_link.array
          - event.purefa_replica_link.local_pod
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: >-
              Replica link {{ event.purefa_replica_link.local_pod }} lag {{ event.purefa_replica_link.lag_s }}s
              exceeds RPO {{ event.purefa_replica_link.rpo_seconds }}s
            detail: >-
              recovery point {{ event.purefa_replica_link.recovery_point_age_s }}s old,
              status={{ event.purefa_replica_link.status }}, breached for {{ event.purefa_replica_link.rpo_breach_polls }} polls
            target_array: "{{ event.purefa_replica_link.array }}"
            alert_log: "{{ alert_log }}"

    - name: Replica link lag above the RPO for N polls - escalate
      condition: >-
        event.purefa_replica_link.direction == "outbound" and
        event.purefa_replica_link.rpo_breached == true and
        event.purefa_replica_link.rpo_breach_polls >= vars.rpo_escalate_polls
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefa_replica_link.array
          - event.purefa_replica_link.local_pod
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: >-
              RPO breach on {{ event.purefa_replica_link.local_pod }} -> {{ event.purefa_replica_link.remote_array }}
              has persisted for {{ event.purefa_replica_link.rpo_breach_polls }} polls
            detail: >-
              lag {{ event.purefa_replica_link.lag_s }}s vs RPO {{ event.purefa_replica_link.rpo_seconds }}s,
              recovery point {{ event.purefa_replica_link.recovery_point_age_s }}s old
            target_array: "{{ event.purefa_replica_link.array }}"
            alert_log: "{{ alert_log }}"

    - name: Stretched pod member offline - prefer the online array on its hosts
      condition: >-
        event.purefa_stretched_pod.pod is defined and
        event.purefa_stretched_pod.all_online == false and
        event.purefa_stretched_pod.maintenance_active == false and
        vars.activecluster_auto_prefer == true
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - event.purefa_stretched_pod.array
          - event.purefa_stretched_pod.pod
      action:
        run_playbook:
          name: playbooks/preferred_array.yml
          extra_vars:
            target_array: "{{ event.purefa_stretched_pod.array }}"
            pod: "{{ event.purefa_stretched_pod.pod }}"
            online_arrays: "{{ event.purefa_stretched_pod.online_arrays }}"
            offline_arrays: "{{ event.purefa_stretched_pod.offline_arrays }}"
            mode: prefer_online
            alert_log: "{{ alert_log }}"

    - name: Stretched pod member offline - notify only
      condition: >-
        event.purefa_stretched_pod.pod is defined and
        (event.purefa_stretched_pod.all_online == false or event.purefa_stretched_pod.mediator_online == false) and
        (event.purefa_stretched_pod.maintenance_active == true or vars.activecluster_auto_prefer == false or event.purefa_stretched_pod.all_online == true)
      throttle:
        once_within: 30 minutes
        group_by_attributes:
          - event.purefa_stretched_pod.array
          - event.purefa_stretched_pod.pod
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "Stretched pod {{ event.purefa_stretched_pod.pod }} degraded as seen from {{ event.purefa_stretched_pod.array }}"
            detail: "{{ event.purefa_stretched_pod.members }}"
            target_array: "{{ event.purefa_stretched_pod.array }}"
            alert_log: "{{ alert_log }}"

    - name: Stretched pod recovered - restore host preferred arrays
      condition: >-
        event.purefa_stretched_pod.recovered == true and
        vars.activecluster_auto_prefer == true
      action:
        run_playbook:
          name: playbooks/preferred_array.yml
          extra_vars:
            target_array: "{{ event.purefa_stretched_pod.array }}"
            pod: "{{ event.purefa_stretched_pod.pod }}"
            online_arrays: "{{ event.purefa_stretched_pod.online_arrays }}"
            offline_arrays: []
            mode: restore
            alert_log: "{{ alert_log }}"

    - name: Protection group replication overdue or stuck - replicate now
      condition: >-
        event.purefa_pg_replication.pgroup is defined and
        (event.purefa_pg_replication.overdue == true or event.purefa_pg_replication.stuck == true) and
        event.purefa_pg_replication.maintenance_active == false and
        vars.replication_auto_replicate_now == true and
        vars.orchestrator_enabled == false
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_pg_replication.array
          - event.purefa_pg_replication.pgroup
      action:
        run_playbook:
          name: playbooks/replicate_now.yml
          extra_vars:
            target_array: "{{ event.purefa_pg_replication.array }}"
            pgroup: "{{ event.purefa_pg_replication.pgroup }}"
            reason: "{{ 'stuck' if event.purefa_pg_replication.stuck else 'overdue' }}"
            since_last_completed_s: "{{ event.purefa_pg_replication.since_last_completed_s }}"
            frequency_ms: "{{ event.purefa_pg_replication.frequency_ms }}"
            in_progress: "{{ event.purefa_pg_replication.in_progress }}"
            alert_log: "{{ alert_log }}"

    # With orchestrator_enabled true the overdue or stuck group is handed to
    # the automation orchestrator, where an approval gates the immediate
    # replicated snapshot (orchestrator/replication_overdue_approval.json);
    # the auto switch is not consulted on that route. Same throttle as above.
    - name: Protection group replication overdue or stuck - hand the event to the orchestrator
      condition: >-
        event.purefa_pg_replication.pgroup is defined and
        (event.purefa_pg_replication.overdue == true or event.purefa_pg_replication.stuck == true) and
        event.purefa_pg_replication.maintenance_active == false and
        vars.orchestrator_enabled == true
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_pg_replication.array
          - event.purefa_pg_replication.pgroup
      action:
        run_playbook:
          name: playbooks/orchestrator_post.yml
          extra_vars:
            orchestrator_url: "{{ orchestrator_url }}"
            orchestrator_webhook_path: "{{ orchestrator_paths.replication }}"
            orchestrator_validate_certs: "{{ orchestrator_validate_certs }}"
            event: "{{ event }}"
            array: "{{ event.purefa_pg_replication.array }}"
            alert_log: "{{ alert_log }}"

    - name: Protection group replication overdue or stuck - notify only
      condition: >-
        event.purefa_pg_replication.pgroup is defined and
        (event.purefa_pg_replication.overdue == true or event.purefa_pg_replication.stuck == true) and
        (event.purefa_pg_replication.maintenance_active == true or
         (vars.replication_auto_replicate_now == false and vars.orchestrator_enabled == false))
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_pg_replication.array
          - event.purefa_pg_replication.pgroup
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: >-
              Protection group {{ event.purefa_pg_replication.pgroup }} on {{ event.purefa_pg_replication.array }}
              is {{ 'stuck' if event.purefa_pg_replication.stuck else 'overdue' }}
            detail: >-
              last completed {{ event.purefa_pg_replication.since_last_completed_s }}s ago,
              schedule every {{ event.purefa_pg_replication.frequency_ms }}ms,
              in progress={{ event.purefa_pg_replication.in_progress }},
              targets={{ event.purefa_pg_replication.targets }}
            target_array: "{{ event.purefa_pg_replication.array }}"
            alert_log: "{{ alert_log }}"

- name: FlashArray DR drill
  hosts: all

  sources:
    - ansible.eda.tick:
        delay: "{{ dr_drill_interval_s }}"

  rules:
    - name: Drill every replicated protection group on its target
      condition: event.i is defined
      action:
        run_playbook:
          name: playbooks/dr_drill.yml
          extra_vars:
            dr_drills: "{{ dr_drills }}"
            alert_log: "{{ alert_log }}"
