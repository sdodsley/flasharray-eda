---
# Capacity: physical utilisation, days-to-full from the array's own space
# history, the fastest-growing volumes since the previous poll, and what is
# sitting in pending eradication.
#
# Nothing here frees space on its own. Crossing the risk threshold records an
# approval request (with a request id) listing what could be reclaimed and
# which other arrays have headroom. The second ruleset is the approval gate:
# a POST to its webhook with {"request_id": ..., "approve": true, "approver":
# "<name>", "action": "eradicate_pending"} runs the reclaim playbook (only on
# the candidates the request listed that are still pending), anything else
# is logged.
# In Ansible Automation Platform the first ruleset calls run_workflow_template
# against a workflow whose first node is a manual approval and the webhook
# ruleset is not needed.
#
# With orchestrator_enabled true (vars) the risk rule instead hands the event
# to the automation orchestrator (playbooks/orchestrator_post.yml posts it to
# the EDA trigger named by orchestrator_paths.capacity) and the approval
# happens in a workflow there; no request file is written and the approvals
# webhook below is idle. With it false nothing changes. docs/ORCHESTRATOR.md
# has the contract; the switch is a literal in a condition because rulebook
# conditions take no filters or defaults.
#
# The approvals webhook needs a bearer token: APPROVAL_TOKEN comes from the
# environment (run.sh passes it with --env-vars; it never sits in a vars file)
# and an approver sends -H "Authorization: Bearer $APPROVAL_TOKEN". Keep the
# approval port reachable only by approvers.

- name: FlashArray capacity
  hosts: all

  sources:
    - sdodsley.flasharray_eda.purefa_events:
        arrays: "{{ purefa_arrays }}"
        signals: [telemetry]
        telemetry_interval: "{{ telemetry_interval }}"
        top_growers: 5

  rules:
    # A poll that fails once is a blip; one that keeps failing is an array
    # nobody is watching. The first failure of a streak is recorded at info
    # (the alert log; under the default Slack floor), once an hour per array
    # and signal, because health.yml already pages for the array itself and
    # eight rulebooks poll the same arrays; a streak the plugin flags as
    # escalated (poll_error_escalate, default 10 polls) pages at critical once
    # every six hours, since a signal that fails on its own is worth a page.
    # Anything in between is logged below.
    - name: Poll failing for many polls - escalate
      condition: >-
        event.purefa_poll_error is defined and
        event.purefa_poll_error.escalate == true
      throttle:
        once_within: 6 hours
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: critical
            subject: "{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll has failed {{ event.purefa_poll_error.consecutive }} times in a row"
            detail: "{{ event.purefa_poll_error.error }}"
            target_array: "{{ event.purefa_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Poll failed - notify once
      condition: >-
        event.purefa_poll_error is defined and
        event.purefa_poll_error.consecutive == 1
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.purefa_poll_error.array
          - event.purefa_poll_error.signal
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: info
            subject: "{{ event.purefa_poll_error.array }} {{ event.purefa_poll_error.signal }} poll failed"
            detail: "{{ event.purefa_poll_error.error }}"
            target_array: "{{ event.purefa_poll_error.array }}"
            alert_log: "{{ alert_log }}"

    - name: Report poll errors without acting
      condition: event.purefa_poll_error is defined
      action:
        debug:
          msg: "poll failed ({{ event.purefa_poll_error.signal }} on {{ event.purefa_poll_error.array }}): {{ event.purefa_poll_error.error }}"

    - name: Array over capacity risk threshold - raise an approval request
      condition: >-
        event.purefa_capacity.used_pct is defined and
        event.purefa_capacity.used_pct >= vars.capacity_risk_pct and
        vars.orchestrator_enabled == false
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_capacity.array
      action:
        run_playbook:
          name: playbooks/capacity_request.yml
          extra_vars:
            at_risk_array: "{{ event.purefa_capacity.array }}"
            used_pct: "{{ event.purefa_capacity.used_pct }}"
            used_bytes: "{{ event.purefa_capacity.used_bytes }}"
            capacity_bytes: "{{ event.purefa_capacity.capacity_bytes }}"
            days_to_full: "{{ event.purefa_capacity.days_to_full }}"
            top_growers: "{{ event.purefa_capacity.top_growers }}"
            pending_eradication_volumes: "{{ event.purefa_capacity.pending_eradication_volumes }}"
            pending_eradication_snapshots: "{{ event.purefa_capacity.pending_eradication_snapshots }}"
            candidate_targets: "{{ event.purefa_capacity.others }}"
            request_dir: "{{ request_dir }}"
            alert_log: "{{ alert_log }}"

    # Same trigger and throttle as the rule above; the whole event travels so
    # the workflow sees every field the request file would have held.
    - name: Array over capacity risk threshold - hand the event to the orchestrator
      condition: >-
        event.purefa_capacity.used_pct is defined and
        event.purefa_capacity.used_pct >= vars.capacity_risk_pct and
        vars.orchestrator_enabled == true
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_capacity.array
      action:
        run_playbook:
          name: playbooks/orchestrator_post.yml
          extra_vars:
            orchestrator_url: "{{ orchestrator_url }}"
            orchestrator_webhook_path: "{{ orchestrator_paths.capacity }}"
            orchestrator_validate_certs: "{{ orchestrator_validate_certs }}"
            event: "{{ event }}"
            array: "{{ event.purefa_capacity.array }}"
            alert_log: "{{ alert_log }}"
            orchestrator_fallback_local: "{{ orchestrator_fallback_local }}"
            request_dir: "{{ request_dir }}"

    - name: Array will be full within the warning horizon - notify
      condition: >-
        event.purefa_capacity.days_to_full_known == true and
        event.purefa_capacity.days_to_full <= vars.capacity_days_to_full_warning
      throttle:
        once_within: 24 hours
        group_by_attributes:
          - event.purefa_capacity.array
      action:
        run_playbook:
          name: playbooks/notify.yml
          extra_vars:
            severity: warning
            subject: "{{ event.purefa_capacity.array }} full in about {{ event.purefa_capacity.days_to_full }} days at the 7-day growth rate"
            detail: >-
              used={{ event.purefa_capacity.used_pct }}%
              growth={{ event.purefa_capacity.growth_bytes_per_day }} bytes/day
              top growers={{ event.purefa_capacity.top_growers }}
            target_array: "{{ event.purefa_capacity.array }}"
            alert_log: "{{ alert_log }}"

- name: FlashArray capacity approvals
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: "{{ approval_port }}"
        token: "{{ APPROVAL_TOKEN }}"

  rules:
    - name: Approved request - reclaim
      condition: >-
        event.payload.request_id is defined and
        event.payload.approve == true and
        event.payload.action is defined
      action:
        run_playbook:
          name: playbooks/capacity_reclaim.yml
          extra_vars:
            request_id: "{{ event.payload.request_id }}"
            approver: "{{ event.payload.approver | default('unknown') }}"
            reclaim_action: "{{ event.payload.action }}"
            request_dir: "{{ request_dir }}"
            alert_log: "{{ alert_log }}"

    - name: Rejected or malformed request - log
      condition: >-
        event.payload.request_id is defined and
        (event.payload.approve is not defined or
         event.payload.approve != true or
         event.payload.action is not defined)
      action:
        debug:
          msg: >-
            capacity request {{ event.payload.request_id }} rejected or malformed
            (approve={{ event.payload.approve | default('missing') }},
            action={{ event.payload.action | default('missing') }})
            by {{ event.payload.approver | default('unknown') }}
