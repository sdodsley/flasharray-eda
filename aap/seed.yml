---
# Seed an Ansible Automation Platform 2.7 installation with the objects this
# project needs. Everything is addressed by name, so the play is idempotent:
# re-run it after editing the variables and only the differences are applied.
#
#   ansible-galaxy collection install -r aap/requirements.yml   # from Automation Hub
#   cp aap/vars/example.yml vars/local-aap.yml                  # gitignored; edit
#   export AAP_HOST=https://<gateway> AAP_TOKEN=<token>          # plus the ARRAY_*_URL / ARRAY_*_TOKEN pairs
#   ansible-playbook -i aap/inventory/example.yml aap/seed.yml -e @vars/local-aap.yml
#
# Created, in order: the organization; the "FlashArray API", "FlashArray
# fleet" and "Orchestrator service account" credential types; one credential
# per array, one fleet credential carrying every array, and one for the
# orchestrator service account when its variables are set; the "FlashArrays"
# inventory with one host per array plus localhost; the project; the
# execution environment reference; one job template per playbook, each with
# the fleet credential attached; the controller-tier capacity workflow
# (request -> approval -> reclaim, notify on failure); and, on the
# Event-Driven Ansible controller, a decision environment, a project, the
# same three credential types and credentials, and one activation per
# platform rulebook (extensions/eda/rulebooks/platform/). Nothing here
# reaches an array or the orchestrator; aap/README.md lists what the seed
# cannot create. Secrets are read from the environment variables named in
# the vars file and written nowhere by this play.
- name: Seed Ansible Automation Platform for flasharray-eda
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/example.yml
  module_defaults:
    group/ansible.platform.gateway:
      aap_hostname: "{{ aap_hostname }}"
      aap_token: "{{ aap_token }}"
      aap_validate_certs: "{{ aap_validate_certs }}"
      aap_request_timeout: "{{ aap_request_timeout }}"
    # ansible.controller 4.8.0 (the build shipped with the 2.7 installer)
    # declares aap_token but authenticates with HTTP basic auth only, so the
    # controller objects need AAP_USERNAME and AAP_PASSWORD as well.
    group/ansible.controller.controller:
      aap_hostname: "{{ aap_hostname }}"
      aap_username: "{{ aap_username | default(omit, true) }}"
      aap_password: "{{ aap_password | default(omit, true) }}"
      aap_token: "{{ aap_token }}"
      aap_validate_certs: "{{ aap_validate_certs }}"
      aap_request_timeout: "{{ aap_request_timeout }}"
    group/ansible.eda.eda:
      aap_hostname: "{{ aap_hostname }}"
      aap_token: "{{ aap_token }}"
      aap_validate_certs: "{{ aap_validate_certs }}"
      aap_request_timeout: "{{ aap_request_timeout }}"
  vars:
    array_credential_prefix: "FlashArray - "
    fleet_credential_name: "FlashArray fleet - {{ aap_organization }}"
    orchestrator_credential_name: "Orchestrator service account - flasharray-eda"
    platform_credential_name: "Platform user - flasharray-eda"
    slack_credential_name: "Slack webhook - flasharray-eda"
    slack_notification_name: "Slack - flasharray-eda"
    # the Slack webhook credential exists, and sits on the notify template,
    # only when the webhook URL is set; the notification template only when
    # the bot token and the channel are
    slack_seeded: "{{ lookup('env', aap_slack_webhook_env) | length > 0 }}"
    slack_bot_seeded: "{{ lookup('env', aap_slack_bot_token_env) | length > 0 and lookup('env', aap_slack_channel_env) | length > 0 }}"
    # the orchestrator credential, its EDA twin and the template that posts
    # to the orchestrator exist only when the service account's client id is
    # set in the environment
    orchestrator_seeded: "{{ lookup('env', aap_orchestrator_client_id_env) | length > 0 }}"
    workflow_name: "FlashArray - capacity reclaim (controller tier)"
    # Fixed names: orchestrator workflow definitions and the platform
    # rulebooks' run_job_template actions refer to them, so a rename here is
    # a rename everywhere. Every template carries the fleet credential, which
    # injects every array's address and token as purefa_fleet_json;
    # playbooks/tasks/resolve_array.yml picks the entry of the array a launch
    # names and sets credential_array to it, so one template serves every
    # array. A launch may still pass one array's "FlashArray API" credential
    # instead (credential_names on an orchestrator node); the playbooks then
    # refuse to act on any other array. The orchestrator poster also takes
    # the service account.
    job_templates:
      - name: "FlashArray - capacity request"
        playbook: playbooks/capacity_request.yml
        description: "Raise a capacity approval request; artifacts request_id, candidate_count, candidates, at_risk_array"
      - name: "FlashArray - capacity reclaim"
        playbook: playbooks/capacity_reclaim.yml
        description: "Eradicate the pending-eradication candidates of an approved request; artifacts request_id, eradicated, refused, result"
      - name: "FlashArray - notify"
        playbook: playbooks/notify.yml
        description: "Append a notify record to the alert log and post it to Slack when the webhook credential is attached; artifact record_kind"
        credentials: "{{ [fleet_credential_name] + ([slack_credential_name] if slack_seeded | bool else []) }}"
      - name: "FlashArray - expand volume"
        playbook: playbooks/expand_volume.yml
        description: "Grow one volume after checking its name and current size; artifacts volume, old_size, new_size"
      - name: "FlashArray - DR drill"
        playbook: playbooks/dr_drill.yml
        description: "Copy, verify and destroy a volume from the latest replicated snapshot; artifacts drills, failed_count"
        extra_vars:
          dr_drills: "{{ aap_dr_drills }}"
      - name: "FlashArray - identify LED"
        playbook: playbooks/identify_led.yml
        description: "Light or clear a component's identify LED; artifacts component, led_state"
      - name: "FlashArray - reconcile"
        playbook: playbooks/reconcile.yml
        description: "Reapply NTP or DNS from the git baseline after an audited change; artifacts ntp_changed, dns_changed"
      - name: "FlashArray - apply baseline"
        playbook: playbooks/apply_baseline.yml
        description: "Apply the git baseline of the array in the limit (localhost refreshes the checkout); artifacts ntp_changed, dns_changed, git_head"
        # one launch applies one array's baseline; localhost stays in so the
        # first play still refreshes the checkout
        limit: "localhost,{{ aap_default_array }}"
      - name: "FlashArray - protect now"
        playbook: playbooks/protect_now.yml
        description: "Snapshot every local protection group and lengthen the eradication delay; artifacts snapshot_suffix, groups_snapshotted, groups_failed, eradication_delay_days"
      - name: "FlashArray - QoS cap"
        playbook: playbooks/qos_cap.yml
        description: "Apply or lift a temporary IOPS cap; artifacts volume, mode, applied_iops, previous_iops"
      - name: "FlashArray - remediate DNS"
        playbook: playbooks/remediate_dns.yml
        description: "Reapply the baseline DNS domain and nameservers to one array after a drift poll"
      - name: "FlashArray - remediate NTP"
        playbook: playbooks/remediate_ntp.yml
        description: "Reapply the baseline NTP servers to one array after a drift poll"
      - name: "FlashArray - replicate now"
        playbook: playbooks/replicate_now.yml
        description: "Take an immediate replicated snapshot of an overdue or stuck protection group; artifacts pgroup, snapshot_suffix, changed"
      - name: "FlashArray - preferred array"
        playbook: playbooks/preferred_array.yml
        description: "Point the hosts of a degraded stretched pod at the online array, or clear the preference on recovery"
      - name: "FlashArray - alert runbook"
        playbook: playbooks/alert_runbook.yml
        description: "Route an opened alert through the alert-code runbook map: notify, ticket, or ticket plus per-code tasks"
      - name: "FlashArray - orchestrator post"
        playbook: playbooks/orchestrator_post.yml
        description: "Post one event envelope to the automation orchestrator's EDA webhook trigger"
        credentials: ["{{ fleet_credential_name }}", "{{ orchestrator_credential_name }}"]
        requires: orchestrator
      - name: "FlashArray - DR promote"
        playbook: playbooks/dr_promote.yml
        description: "Promote the target pod of an ActiveDR replica link for a failover test; artifacts array, pod, promotion status before and after, link status, changed"
      - name: "FlashArray - DR demote"
        playbook: playbooks/dr_demote.yml
        description: "Demote a promoted target pod again, discarding the writes made during the test; artifacts array, pod, promotion status before and after, link status, changed"
      - name: "FlashArray - DR switchover"
        playbook: playbooks/dr_switchover.yml
        description: "Planned ActiveDR switchover: demote the source pod with quiesce, promote the target pod once the link reports the copy complete, so the link reverses; the same template with the sides swapped fails back; with eradicate_undo_demote true the undo-demote pod an earlier demotion left is eradicated first; artifacts both pods' states before and after, the link's direction and status, the undo-demote pods eradicated, changed"
  tasks:
    - name: Refuse to run without the platform address and token
      ansible.builtin.assert:
        that:
          - aap_hostname | length > 0
          - aap_token | length > 0
        fail_msg: "set AAP_HOST and AAP_TOKEN (aap_hostname / aap_token) first"
        quiet: true

    - name: Refuse to run with an array's environment variables unset
      ansible.builtin.assert:
        that:
          - lookup('env', item.fa_url_env) | length > 0
          - lookup('env', item.api_token_env) | length > 0
        fail_msg: "{{ item.fa_url_env }} and {{ item.api_token_env }} must be set for {{ item.name }}"
        quiet: true
      loop: "{{ aap_arrays }}"
      loop_control:
        label: "{{ item.name }}"

    # The fleet credential's one input is a JSON list of every array's name,
    # address and token; the list is built here from the environment and is
    # held in a no_log fact.
    - name: Collect every array's address and token for the fleet credential
      ansible.builtin.set_fact:
        fleet_arrays: >-
          {{ fleet_arrays | default([]) + [{'name': item.name,
             'fa_url': lookup('env', item.fa_url_env),
             'api_token': lookup('env', item.api_token_env)}] }}
      loop: "{{ aap_arrays }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    # --- platform gateway ----------------------------------------------------
    - name: Organization
      ansible.platform.organization:
        name: "{{ aap_organization }}"
        description: "Event-Driven Ansible for standalone FlashArrays (flasharray-eda)"
        state: present

    # --- automation controller -----------------------------------------------
    # The platform writes this base URL into the links of its notifications
    # (jobs, workflow approvals); the installer leaves a placeholder there.
    - name: Base URL for the links in notifications
      ansible.controller.settings:
        name: TOWER_URL_BASE
        value: "{{ aap_url_base }}"

    - name: Credential type for one array (fa_url, api_token and credential_array as extra_vars)
      ansible.controller.credential_type:
        name: FlashArray API
        description: "One array's management address, API token and inventory name, injected as the extra_vars fa_url, api_token and credential_array; the playbooks refuse to act on an array other than credential_array"
        kind: cloud
        inputs: "{{ lookup('file', playbook_dir ~ '/files/credential_type_flasharray_api_inputs.json') | from_json }}"
        injectors: "{{ lookup('file', playbook_dir ~ '/files/credential_type_flasharray_api_injectors.json') | from_json }}"
        state: present

    - name: Credential type for the fleet (every array's address and token as one JSON list)
      ansible.controller.credential_type:
        name: FlashArray fleet
        description: "A JSON list of {name, fa_url, api_token}, one per array, injected as the extra_var purefa_fleet_json; playbooks/tasks/resolve_array.yml picks the entry of the array a launch names"
        kind: cloud
        inputs: "{{ lookup('file', playbook_dir ~ '/files/credential_type_flasharray_fleet_inputs.json') | from_json }}"
        injectors: "{{ lookup('file', playbook_dir ~ '/files/credential_type_flasharray_fleet_injectors.json') | from_json }}"
        state: present

    - name: Credential type for the orchestrator service account
      ansible.controller.credential_type:
        name: Orchestrator service account
        description: "Client credentials of an automation orchestrator service account: AO_CLIENT_ID and AO_CLIENT_SECRET in the environment, orchestrator_url as an extra var"
        kind: cloud
        inputs: "{{ lookup('file', playbook_dir ~ '/files/credential_type_orchestrator_sa_inputs.json') | from_json }}"
        injectors: "{{ lookup('file', playbook_dir ~ '/files/credential_type_orchestrator_sa_injectors.json') | from_json }}"
        state: present

    - name: Credential type for a Slack incoming webhook
      ansible.controller.credential_type:
        name: Slack webhook
        description: "An incoming webhook URL, injected as the environment variable SLACK_WEBHOOK_URL; playbooks/notify.yml posts every notification to it"
        kind: cloud
        inputs: "{{ lookup('file', playbook_dir ~ '/files/credential_type_slack_webhook_inputs.json') | from_json }}"
        injectors: "{{ lookup('file', playbook_dir ~ '/files/credential_type_slack_webhook_injectors.json') | from_json }}"
        state: present

    # Kept beside the fleet credential for launches that pin one array
    # (credential_names on an orchestrator node, or a person in the prompt).
    - name: One FlashArray API credential per array
      ansible.controller.credential:
        name: "{{ array_credential_prefix }}{{ item.name }}"
        description: "fa_url and api_token for {{ item.name }}"
        organization: "{{ aap_organization }}"
        credential_type: FlashArray API
        inputs:
          fa_url: "{{ lookup('env', item.fa_url_env) }}"
          api_token: "{{ lookup('env', item.api_token_env) }}"
          array_name: "{{ item.name }}"
        update_secrets: "{{ aap_update_secrets | bool }}"
        state: present
      loop: "{{ aap_arrays }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Fleet credential (every array in one credential)
      ansible.controller.credential:
        name: "{{ fleet_credential_name }}"
        description: "name, fa_url and api_token of every array in aap_arrays, as one JSON list"
        organization: "{{ aap_organization }}"
        credential_type: FlashArray fleet
        inputs:
          arrays: "{{ fleet_arrays | to_json }}"
        update_secrets: "{{ aap_update_secrets | bool }}"
        state: present
      no_log: true

    - name: Orchestrator service account credential (when its variables are set)
      when: orchestrator_seeded | bool
      ansible.controller.credential:
        name: "{{ orchestrator_credential_name }}"
        description: "Service account bound to this project's EDA trigger in the orchestrator"
        organization: "{{ aap_organization }}"
        credential_type: Orchestrator service account
        inputs:
          orchestrator_url: "{{ lookup('env', aap_orchestrator_url_env) }}"
          client_id: "{{ lookup('env', aap_orchestrator_client_id_env) }}"
          client_secret: "{{ lookup('env', aap_orchestrator_client_secret_env) }}"
        update_secrets: "{{ aap_update_secrets | bool }}"
        state: present
      no_log: true

    - name: Slack webhook credential (when the webhook variable is set)
      when: slack_seeded | bool
      ansible.controller.credential:
        name: "{{ slack_credential_name }}"
        description: "Incoming webhook of the channel the FlashArray notifications go to"
        organization: "{{ aap_organization }}"
        credential_type: Slack webhook
        inputs:
          webhook_url: "{{ lookup('env', aap_slack_webhook_env) }}"
        update_secrets: "{{ aap_update_secrets | bool }}"
        state: present
      no_log: true

    # The inventory holds names only; addresses and tokens travel in the
    # credentials. The variables are stored as written (not templated here).
    - name: Inventory
      ansible.controller.inventory:
        name: "{{ aap_inventory_name }}"
        description: "One host per array, named as in purefa_arrays; fa_url and api_token come from the FlashArray fleet or FlashArray API credentials, not from host variables"
        organization: "{{ aap_organization }}"
        variables:
          ansible_connection: local
          ansible_python_interpreter: !unsafe "{{ ansible_playbook_python }}"
        state: present

    - name: Localhost in the inventory
      ansible.controller.host:
        name: localhost
        inventory: "{{ aap_inventory_name }}"
        description: "notify, capacity request / reclaim, alert runbook, the orchestrator post and the DR drill run here"
        state: present

    - name: One host per array
      ansible.controller.host:
        name: "{{ item.name }}"
        inventory: "{{ aap_inventory_name }}"
        description: "FlashArray {{ item.name }}; address and token come from the credential {{ fleet_credential_name }} or {{ array_credential_prefix }}{{ item.name }}"
        state: present
      loop: "{{ aap_arrays }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Execution environment reference
      ansible.controller.execution_environment:
        name: "{{ aap_ee_name }}"
        description: "Image the FlashArray job templates run in; needs py-pure-client and the everpure.flasharray collection"
        image: "{{ aap_ee_image }}"
        organization: "{{ aap_organization }}"
        pull: "{{ aap_ee_pull }}"
        state: present

    - name: Project
      ansible.controller.project:
        name: "{{ aap_project_name }}"
        description: "{{ aap_project_url }} ({{ aap_project_branch }})"
        organization: "{{ aap_organization }}"
        scm_type: git
        scm_url: "{{ aap_project_url }}"
        scm_branch: "{{ aap_project_branch }}"
        scm_update_on_launch: false
        default_environment: "{{ aap_ee_name }}"
        wait: true
        state: present

    # Job failures and the workflow's approval events go to Slack through
    # the platform's own notification template (bot token, chat:write); it
    # exists before the templates that name it.
    - name: Slack notification template (when the bot token and channel are set)
      when: slack_bot_seeded | bool
      ansible.controller.notification_template:
        name: "{{ slack_notification_name }}"
        description: "FlashArray job failures and controller-tier approval events"
        organization: "{{ aap_organization }}"
        notification_type: slack
        notification_configuration:
          token: "{{ lookup('env', aap_slack_bot_token_env) }}"
          channels: ["#{{ lookup('env', aap_slack_channel_env) | regex_replace('^#', '') }}"]
          hex_color: ""
        state: present
      no_log: true

    # Every template prompts for extra vars (target_array and the rest come
    # from the launch), for credentials (the fleet credential is attached; a
    # launch may swap it for one array's FlashArray API credential) and for
    # a limit (apply baseline is limited to one array per launch). A
    # single-array credential for an array other than the one the launch
    # names makes the playbook fail at its credential_array check instead of
    # acting on that array.
    - name: One job template per playbook
      when: >-
        item.requires | default('') != 'orchestrator'
        or (aap_seed_orchestrator_template | bool and orchestrator_seeded | bool)
      ansible.controller.job_template:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        organization: "{{ aap_organization }}"
        project: "{{ aap_project_name }}"
        playbook: "{{ item.playbook }}"
        inventory: "{{ aap_inventory_name }}"
        execution_environment: "{{ aap_ee_name }}"
        credentials: "{{ item.credentials | default([fleet_credential_name]) }}"
        extra_vars: "{{ aap_job_extra_vars | combine(item.extra_vars | default({})) }}"
        limit: "{{ item.limit | default(omit) }}"
        ask_variables_on_launch: true
        ask_credential_on_launch: true
        ask_limit_on_launch: true
        notification_templates_error: "{{ [slack_notification_name] if slack_bot_seeded | bool else omit }}"
        state: present
      loop: "{{ job_templates }}"
      loop_control:
        label: "{{ item.name }}"

    # The request node's artifacts (request_id, at_risk_array, ...) reach
    # the reclaim node as extra vars, which is how the two playbooks hand
    # over. A denied or timed-out approval takes the failure edge.
    - name: Controller-tier capacity workflow
      ansible.controller.workflow_job_template:
        name: "{{ workflow_name }}"
        description: "capacity request -> approval -> reclaim; notify when a node fails or the approval is denied"
        organization: "{{ aap_organization }}"
        inventory: "{{ aap_inventory_name }}"
        ask_variables_on_launch: true
        destroy_current_nodes: "{{ aap_rebuild_workflow_nodes | bool }}"
        notification_templates_approvals: "{{ [slack_notification_name] if slack_bot_seeded | bool else omit }}"
        notification_templates_error: "{{ [slack_notification_name] if slack_bot_seeded | bool else omit }}"
        notification_templates_success: "{{ [slack_notification_name] if slack_bot_seeded | bool else omit }}"
        state: present
        workflow_nodes:
          - identifier: request
            unified_job_template:
              name: "FlashArray - capacity request"
              type: job_template
              organization:
                name: "{{ aap_organization }}"
            related:
              success_nodes:
                - identifier: approve
              failure_nodes:
                - identifier: notify_failure
          - identifier: approve
            unified_job_template:
              name: "Approve eradication of the request's pending-eradication candidates"
              description: "Approve to eradicate the volumes and snapshots the request listed (only those still pending); deny, or let it time out, to keep them"
              type: workflow_approval
              timeout: "{{ aap_approval_timeout_s | int }}"
            related:
              success_nodes:
                - identifier: reclaim
              failure_nodes:
                - identifier: notify_rejected
          - identifier: reclaim
            unified_job_template:
              name: "FlashArray - capacity reclaim"
              type: job_template
              organization:
                name: "{{ aap_organization }}"
            extra_data:
              reclaim_action: eradicate_pending
              approver: workflow-approval
              # lets the reclaim rebuild the request from the request node's
              # artifacts when request_dir is not shared between the jobs; a
              # launch without it is refused when the request file is absent
              rebuild_from_artifacts: true
            related:
              failure_nodes:
                - identifier: notify_failure
          - identifier: notify_rejected
            unified_job_template:
              name: "FlashArray - notify"
              type: job_template
              organization:
                name: "{{ aap_organization }}"
            extra_data:
              severity: warning
              subject: "capacity reclaim not approved (denied or timed out)"
              detail: "the request stays awaiting_approval; nothing was eradicated"
          - identifier: notify_failure
            unified_job_template:
              name: "FlashArray - notify"
              type: job_template
              organization:
                name: "{{ aap_organization }}"
            extra_data:
              severity: critical
              subject: "capacity reclaim workflow failed"
              detail: "see the failed node of the workflow job"

    # --- Event-Driven Ansible controller --------------------------------------
    - name: Decision environment reference
      ansible.eda.decision_environment:
        name: "{{ aap_eda_de_name }}"
        description: "Image from decision-environment/: ansible-rulebook, the sdodsley.flasharray_eda and everpure.flasharray collections and py-pure-client"
        image_url: "{{ aap_eda_de_image }}"
        pull_policy: "{{ aap_eda_de_pull_policy }}"
        organization_name: "{{ aap_organization }}"
        state: present

    - name: EDA project
      ansible.eda.project:
        name: "{{ aap_eda_project_name }}"
        description: "{{ aap_project_url }} ({{ aap_project_branch }})"
        url: "{{ aap_project_url }}"
        scm_branch: "{{ aap_project_branch }}"
        organization_name: "{{ aap_organization }}"
        state: present

    # Same inputs as the controller types; EDA credentials inject variables
    # into the activation, which the rulebooks and their run_job_template
    # actions read.
    - name: EDA credential type for one array
      ansible.eda.credential_type:
        name: FlashArray API
        description: "One array's management address, API token and inventory name as the variables fa_url, api_token and credential_array"
        inputs: "{{ lookup('file', playbook_dir ~ '/files/credential_type_flasharray_api_inputs.json') | from_json }}"
        injectors: "{{ lookup('file', playbook_dir ~ '/files/credential_type_flasharray_api_injectors.json') | from_json }}"
        state: present

    - name: EDA credential type for the fleet (the list the source plugin polls)
      ansible.eda.credential_type:
        name: FlashArray fleet
        description: "A JSON list of {name, fa_url, api_token}, one per array, as the variable purefa_arrays the platform rulebooks hand to the purefa_events source"
        inputs: "{{ lookup('file', playbook_dir ~ '/files/credential_type_flasharray_fleet_inputs.json') | from_json }}"
        injectors: "{{ lookup('file', playbook_dir ~ '/files/credential_type_flasharray_fleet_eda_injectors.json') | from_json }}"
        state: present

    - name: EDA credential type for the orchestrator service account
      ansible.eda.credential_type:
        name: Orchestrator service account
        description: "Client credentials of an automation orchestrator service account: AO_CLIENT_ID and AO_CLIENT_SECRET in the environment, orchestrator_url as a variable"
        inputs: "{{ lookup('file', playbook_dir ~ '/files/credential_type_orchestrator_sa_inputs.json') | from_json }}"
        injectors: "{{ lookup('file', playbook_dir ~ '/files/credential_type_orchestrator_sa_injectors.json') | from_json }}"
        state: present

    # Not attached to the activations (the fleet credential carries every
    # array); seeded for a rulebook that polls one array only.
    - name: One EDA credential per array
      ansible.eda.credential:
        name: "{{ array_credential_prefix }}{{ item.name }}"
        description: "fa_url and api_token for {{ item.name }}"
        credential_type_name: FlashArray API
        organization_name: "{{ aap_organization }}"
        inputs:
          fa_url: "{{ lookup('env', item.fa_url_env) }}"
          api_token: "{{ lookup('env', item.api_token_env) }}"
          array_name: "{{ item.name }}"
        state: present
      loop: "{{ aap_arrays }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: EDA fleet credential (every array in one credential)
      ansible.eda.credential:
        name: "{{ fleet_credential_name }}"
        description: "name, fa_url and api_token of every array in aap_arrays, as one JSON list"
        credential_type_name: FlashArray fleet
        organization_name: "{{ aap_organization }}"
        inputs:
          arrays: "{{ fleet_arrays | to_json }}"
        state: present
      no_log: true

    - name: EDA orchestrator service account credential (when its variables are set)
      when: orchestrator_seeded | bool
      ansible.eda.credential:
        name: "{{ orchestrator_credential_name }}"
        description: "Service account bound to this project's EDA trigger in the orchestrator"
        credential_type_name: Orchestrator service account
        organization_name: "{{ aap_organization }}"
        inputs:
          orchestrator_url: "{{ lookup('env', aap_orchestrator_url_env) }}"
          client_id: "{{ lookup('env', aap_orchestrator_client_id_env) }}"
          client_secret: "{{ lookup('env', aap_orchestrator_client_secret_env) }}"
        state: present
      no_log: true

    # An activation's extra vars are the rulebook vars file minus the keys
    # its credentials inject: purefa_arrays comes from the fleet credential
    # and orchestrator_url from the orchestrator credential when that is
    # attached (the controller refuses a key that both the extra vars and a
    # credential define). aap_organization is added for the run_job_template
    # actions. The vars file holds no secrets, so the fact is logged.
    # The EDA controller refuses an activation whose rulebook calls
    # run_job_template unless a credential of its built-in type "Red Hat
    # Ansible Automation Platform" is attached; ansible-rulebook launches the
    # job templates with it. A dedicated platform user with execute on the
    # FlashArray templates is the right owner of this credential.
    - name: EDA platform credential for the run_job_template actions
      ansible.eda.credential:
        name: "{{ platform_credential_name }}"
        description: "Platform user the platform rulebooks launch the FlashArray job templates as"
        organization_name: "{{ aap_organization }}"
        credential_type_name: Red Hat Ansible Automation Platform
        inputs:
          host: "{{ aap_eda_platform_url }}"
          username: "{{ aap_eda_platform_username }}"
          password: "{{ aap_eda_platform_password }}"
          verify_ssl: "{{ aap_validate_certs | bool }}"
        state: present
      no_log: true

    - name: Credentials and extra vars every activation carries
      ansible.builtin.set_fact:
        activation_credentials: "{{ [fleet_credential_name, platform_credential_name] + ([orchestrator_credential_name] if orchestrator_seeded | bool else []) }}"
        activation_extra_vars: >-
          {{ (lookup('file', playbook_dir ~ '/../vars/example.yml') | from_yaml)
             | combine(lookup('file', aap_eda_vars_file) | from_yaml) | dict2items
             | rejectattr('key', 'in', ['purefa_arrays', 'config_arrays'] + (['orchestrator_url'] if orchestrator_seeded | bool else []))
             | items2dict | combine({'aap_organization': aap_organization})
             | to_nice_yaml(indent=2, width=1000) }}

    # ansible.eda.rulebook_activation cannot update an activation and, in
    # 2.13, creates it enabled whatever `enabled` says; so existing ones are
    # skipped and the enabled flag is enforced through the API afterwards.
    - name: Activations that already exist
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/activations/?page_size=200&name__startswith=FlashArray%20rulebook%20-"
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        return_content: true
      register: existing_activations
      no_log: true

    # The EDA controller names a rulebook by its path relative to the
    # project's extensions/eda/rulebooks directory, hence platform/<file>.
    - name: One rulebook activation per platform rulebook
      ansible.eda.rulebook_activation:
        name: "FlashArray rulebook - {{ item | splitext | first }}"
        description: "extensions/eda/rulebooks/platform/{{ item }} with {{ aap_eda_vars_file | basename }} (minus the credential-injected keys) as extra vars"
        project_name: "{{ aap_eda_project_name }}"
        rulebook_name: "platform/{{ item }}"
        decision_environment_name: "{{ aap_eda_de_name }}"
        organization_name: "{{ aap_organization }}"
        extra_vars: "{{ activation_extra_vars }}"
        eda_credentials: "{{ activation_credentials }}"
        enabled: "{{ aap_eda_activations_enabled | bool }}"
        restart_policy: "{{ aap_eda_restart_policy }}"
        log_level: "{{ aap_eda_log_level }}"
        state: present
      when: ('FlashArray rulebook - ' ~ (item | splitext | first)) not in (existing_activations.json.results | map(attribute='name') | list)
      loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../extensions/eda/rulebooks/platform/*.yml') | map('basename') | sort }}"

    - name: Activations as they stand
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/activations/?page_size=200&name__startswith=FlashArray%20rulebook%20-"
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        return_content: true
      register: all_activations
      no_log: true

    - name: Enforce the enabled flag on every FlashArray activation
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/activations/{{ item.id }}/{{ 'enable' if aap_eda_activations_enabled | bool else 'disable' }}/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200, 202, 204]
      loop: "{{ all_activations.json.results }}"
      loop_control:
        label: "{{ item.name }}"
        # ten activations starting in the same second contend for the EDA
        # websocket and some fail their first start; a pause between them avoids it
        pause: "{{ 10 if aap_eda_activations_enabled | bool else 0 }}"
      when: (item.is_enabled | bool) != (aap_eda_activations_enabled | bool)
      changed_when: true
      no_log: true
