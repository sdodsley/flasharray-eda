---
# Decision environment for the rulebook activations aap/seed.yml creates on
# the Event-Driven Ansible controller of Ansible Automation Platform 2.7.
# decision-environment/ in this tree builds the same content on the upstream
# ansible-rulebook image for standalone use; this definition builds it on the
# supported base so an activation runs on a supported image. Build on a host
# that is logged in to registry.redhat.io:
#
#   pip install ansible-builder
#   ansible-builder build -f aap/decision-environment.yml \
#       -t flasharray-eda-de:latest --container-runtime podman
#
# The custom event sources are resolved from collections inside the image, so
# an activation that names purefa_events or purefa_syslog cannot start unless
# the plugins ship in a collection (docs/PACKAGING.md); the seed therefore
# creates the activations disabled.
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-27/de-supported-rhel9:latest

dependencies:
  # The supported images run Ansible on python3.12. Without this pin
  # ansible-builder installs system packages that bring in python3 (3.9)
  # and /usr/bin/python3 ends up without pip in the build stage.
  python_interpreter:
    package_system: python3.12
    python_path: /usr/bin/python3.12
  python:
    - py-pure-client>=1.94.1
  galaxy:
    collections:
      - name: everpure.flasharray
        version: ">=1.46.0"

options:
  package_manager_path: /usr/bin/microdnf
