---
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the newest ansible-core and the tested one (README, Quick start):
        # the two template text differently, and the playbook text tests
        # (tests/unit/test_playbook_text.py) run the playbooks on both
        core: ["ansible-core", "ansible-core~=2.17.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt "${{ matrix.core }}"

      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Lint (black, pyflakes, yamllint)
        run: make lint

      - name: Lint the orchestrator definitions
        run: make lint-ao

      # the repository as the collection sdodsley.flasharray_eda, built into
      # build/ and installed under ./collections; after the lint so that the
      # installed collections are not linted
      - name: Build and install the collection
        run: make collection

      - name: Unit tests (plugins, rulebooks, vars)
        run: make test

      - name: Playbook syntax check
        run: make syntax
