---
# Prometheus scrape configuration for the FlashArray's native OpenMetrics
# exporter (Purity//FA 6.7+). One job per array because each array has its
# own API token; the token sits in a file the Prometheus user can read.
# `namespace=purefa` is required by every endpoint; `/metrics` returns all
# families (a few thousand series on a busy array, well under a second),
# `/metrics/array` only the array-level ones. The job's `array_name` target
# label is what flasharray.rules.yml and the alertmanager rulebook read,
# because only purefa_info carries the name natively.
global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/flasharray.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: flasharray-a
    scheme: https
    metrics_path: /metrics
    params:
      namespace: [purefa]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/array-a.token
    tls_config:
      insecure_skip_verify: true  # or ca_file for an array with a trusted certificate
    static_configs:
      - targets: ["array-a.example.com"]
        labels:
          array_name: array-a

  - job_name: flasharray-b
    scheme: https
    metrics_path: /metrics
    params:
      namespace: [purefa]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/array-b.token
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["array-b.example.com"]
        labels:
          array_name: array-b
