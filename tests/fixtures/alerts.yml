---
# Recorded-shape alert events for replay through ansible.eda.generic:
# a hardware failure (code 42, routed as a ticket), a code with per-code
# runbook tasks (9999, fixture), an unknown code (default route), one
# opened inside a maintenance window (logged, not routed), the hardware
# failure resolving (the resolved notice) and a pod alert first seen
# already resolving (one notice, no runbook).
fixture_events:
  - purefa_alert:
      array: "REPLAY_ARRAY"
      transition: opened
      maintenance_active: false
      alert_id: "900000001"
      code: 42
      severity: warning
      state: open
      component_type: hardware
      component_name: ct0.eth7
      summary: "(hardware:ct0.eth7): failure"
      action: >-
        Review the linked Knowledge Base article. If the alert is not resolved or you need
        further assistance, contact Pure Storage Support and provide the alert text.
      knowledge_base_url: "https://support.purestorage.com/?cid=Alert_0042"
  - purefa_alert:
      array: "REPLAY_ARRAY"
      transition: opened
      maintenance_active: false
      alert_id: "900000002"
      code: 9999
      severity: warning
      state: open
      component_type: fixture
      component_name: fixture
      summary: "(fixture): per-code runbook tasks"
      action: ""
      knowledge_base_url: ""
  - purefa_alert:
      array: "REPLAY_ARRAY"
      transition: opened
      maintenance_active: false
      alert_id: "900000003"
      code: 777
      severity: info
      state: open
      component_type: fixture
      component_name: fixture
      summary: "(fixture): unknown code takes the default route"
      action: ""
      knowledge_base_url: ""
  - purefa_alert:
      array: "REPLAY_ARRAY"
      transition: opened
      maintenance_active: true
      alert_id: "900000004"
      code: 42
      severity: warning
      state: open
      component_type: hardware
      component_name: ct1.eth7
      summary: "(hardware:ct1.eth7): failure during maintenance"
      action: ""
      knowledge_base_url: ""
  - purefa_alert:
      array: "REPLAY_ARRAY"
      transition: closing
      maintenance_active: false
      alert_id: "900000005"
      code: 42
      severity: warning
      severity_down: info
      previous_severity: null
      severity_raised: false
      state: closing
      component_type: hardware
      component_name: ct1.eth7
      summary: "(hardware:ct1.eth7): failure cleared"
      action: ""
      knowledge_base_url: ""
      age_s: 300
      resolved_after_s: 300
  - purefa_alert:
      array: "REPLAY_ARRAY"
      transition: opened
      maintenance_active: false
      alert_id: "900000006"
      code: 120
      severity: critical
      severity_down: warning
      previous_severity: null
      severity_raised: false
      state: closing
      component_type: pod
      component_name: eda-alert-test
      summary: "(pod:eda-alert-test): offline on peer"
      action: ""
      knowledge_base_url: ""
      age_s: 70
      resolved_after_s: 40
