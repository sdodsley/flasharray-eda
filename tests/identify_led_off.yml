---
# Test helper: clear an identify LED after the replay test.
#   ansible-playbook -i inventory/local-lab.yml tests/identify_led_off.yml \
#       -e target_array=<array> -e component=CT1
- name: Clear an identify LED
  hosts: "{{ target_array }}"
  gather_facts: false
  tasks:
    - name: Turn the identify LED off
      everpure.flasharray.purefa_hardware:
        fa_url: "{{ fa_url }}"
        api_token: "{{ api_token }}"
        disable_warnings: true
        name: "{{ component }}"
        enabled: false
