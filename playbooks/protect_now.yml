---
# Protect first, ask questions later. Called by the anomaly rulebook with
# target_array, the signal values, audit_user, audit_command,
# extend_eradication_by_s and alert_log.
#   1. immediate snapshot of every local, non-destroyed protection group
#   2. the enabled eradication delay lengthened by extend_eradication_by_s,
#      rounded up to whole days, never shortened, the disabled delay kept
#   3. critical record with everything that fired
- name: Protect now
  hosts: "{{ target_array }}"
  gather_facts: false
  tasks:
    # On Ansible Automation Platform the FlashArray API credential injects
    # credential_array and fa_url/api_token point at that array whatever
    # host this play runs on, so another array's credential is refused.
    - name: Refuse to run with another array's credential attached
      ansible.builtin.assert:
        that:
          - credential_array is not defined or credential_array == inventory_hostname
        fail_msg: "the attached credential is for {{ credential_array | default('') }}, not {{ inventory_hostname }}"

    - name: List local protection groups and the current eradication delays
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -"
        stdin: |
          import json, os, urllib3
          urllib3.disable_warnings()
          from pypureclient import flasharray
          c = flasharray.Client(target=os.environ["FA_HOST"], api_token=os.environ["FA_TOKEN"], verify_ssl=False)
          pgs = [p.name for p in c.get_protection_groups(filter="is_local='true' and destroyed='false'").items]
          e = list(c.get_arrays().items)[0].to_dict().get("eradication_config") or {}
          print(json.dumps({"pgroups": pgs, "enabled_delay_ms": e.get("enabled_delay") or e.get("eradication_delay"),
                            "disabled_delay_ms": e.get("disabled_delay"), "manual_eradication": e.get("manual_eradication")}))
      environment:
        FA_HOST: "{{ fa_url | regex_replace('^https?://', '') }}"
        FA_TOKEN: "{{ api_token }}"
      register: discovery
      changed_when: false
      no_log: true

    - name: Parse
      ansible.builtin.set_fact:
        protect: "{{ discovery.stdout | from_json }}"
        snap_suffix: "eda-protect-{{ now(utc=true).strftime('%Y%m%d%H%M%S') }}"

    - name: Show what was found
      ansible.builtin.debug:
        var: protect

    - name: Work out the new enabled delay in whole days (the module takes 1-30)
      ansible.builtin.set_fact:
        new_enabled_days: "{{ [30, ((protect.enabled_delay_ms | int) / 86400000 + (extend_eradication_by_s | int) / 86400) | round(0, 'ceil') | int] | min }}"

    - name: Snapshot every local protection group now
      everpure.flasharray.purefa_pgsnap:
        fa_url: "{{ fa_url }}"
        api_token: "{{ api_token }}"
        disable_warnings: true
        name: "{{ item }}"
        suffix: "{{ snap_suffix }}"
        now: true
        state: present
      loop: "{{ protect.pgroups }}"
      register: snaps
      ignore_errors: true

    - name: Lengthen the enabled eradication delay
      when: extend_eradication_by_s | int > 0 and (new_enabled_days | int) * 86400000 > protect.enabled_delay_ms | int
      everpure.flasharray.purefa_eradication:
        fa_url: "{{ fa_url }}"
        api_token: "{{ api_token }}"
        disable_warnings: true
        enabled_delay: "{{ new_enabled_days | int }}"
      register: erad
      ignore_errors: true

    - name: Record
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'protect_now', 'severity': 'critical',
              'array': inventory_hostname,
              'signals': {'drr_drop_pct': drr_drop_pct | default(''), 'snapshot_growth_pct': snapshot_growth_pct | default(''),
                          'audit_user': audit_user | default(''), 'audit_command': audit_command | default('')},
              'snapshots': snaps.results | map(attribute='item') | list, 'snapshot_suffix': snap_suffix,
              'snapshot_failures': snaps.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list,
              'eradication_delay_before_ms': protect.enabled_delay_ms,
              'eradication_delay_after_days': new_enabled_days | int,
              'eradication_changed': erad.changed | default(false),
              'eradication_error': (erad.msg | default('')) if erad.failed | default(false) else ''} | to_json }}
      delegate_to: localhost

    - name: Show
      ansible.builtin.debug:
        msg: >-
          PROTECT NOW on {{ inventory_hostname }}: snapshots {{ snap_suffix }} on {{ protect.pgroups }};
          eradication delay {{ 'lengthened to ' ~ new_enabled_days ~ ' days' if erad.changed | default(false) else 'unchanged' }};
          trigger: DRR -{{ drr_drop_pct | default('?') }}%, snapshots +{{ snapshot_growth_pct | default('?') }}%,
          {{ audit_user | default('?') }} ran {{ audit_command | default('?') }}

    # Job artifacts for a workflow or orchestrator node that follows this one.
    # eradication_delay_days is the enabled delay after this run: the new
    # value when it was lengthened, otherwise the array's current one.
    - name: Publish the outcome as job artifacts
      ansible.builtin.set_stats:
        aggregate: false
        per_host: false
        data: >-
          {{ {'array': inventory_hostname, 'snapshot_suffix': snap_suffix,
              'groups_failed': snaps.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list,
              'groups_snapshotted': snaps.results | map(attribute='item') | list
                                    | difference(snaps.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list),
              'eradication_delay_days': ((new_enabled_days | int) if erad.changed | default(false)
                                         else (((protect.enabled_delay_ms | int) / 86400000) | round(2)))} }}
      run_once: true
      delegate_to: localhost
