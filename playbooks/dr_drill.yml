---
# DR drill: on the replication target, copy one volume out of the latest
# fully transferred snapshot of a replicated protection group, confirm the
# copy exists with the expected size, then destroy and eradicate it. A drill
# that cannot find a completed snapshot, or whose copy fails, records a
# failure; that is the signal a DR plan has silently stopped working.
#
# dr_drills is a list of {target_array, source_array, pgroup, volume (member
# volume name on the source; omit to use the first member), prefix}.
- name: DR drill
  hosts: localhost
  gather_facts: false
  tasks:
    # one key per launch: the copy name carries it, so two launches cannot
    # collide on the same copy (the platform's job id, else a timestamp)
    - name: Pin the drill key of this launch
      ansible.builtin.set_fact:
        dr_drill_key: "{{ tower_job_id | default(awx_job_id | default(now(utc=true).strftime('%Y%m%d%H%M%S'))) }}"

    - name: Run each drill on its target array
      ansible.builtin.include_tasks: dr_drill_one.yml
      loop: "{{ dr_drills }}"
      loop_control:
        loop_var: drill
        label: "{{ drill.target_array }}:{{ drill.source_array }}:{{ drill.pgroup }}"

    # Job artifacts for a workflow or orchestrator node that follows this one:
    # one {target_array, source_array, pgroup, result, error} per drill
    # (collected by dr_drill_one.yml) and how many failed or were skipped.
    # With dr_drill_fail_job true the job then fails when any drill failed,
    # so a schedule's failure notification reaches a person ("FlashArray -
    # DR drill (nightly)" passes it); the orchestrator's nightly definition
    # judges failed_count itself and leaves it false. The artifacts are
    # published either way.
    - name: Publish the drills, and fail the job when told and a drill failed
      block:
        - name: Fail the job when a drill failed
          when: >-
            dr_drill_fail_job | default(false) | bool
            and (drills_done | default([]) | selectattr('result', 'equalto', 'failed') | list | length) > 0
          ansible.builtin.fail:
            msg: >-
              {{ drills_done | selectattr('result', 'equalto', 'failed') | list | length }} drill(s) failed:
              {{ drills_done | selectattr('result', 'equalto', 'failed')
                 | map(attribute='pgroup') | zip(drills_done | selectattr('result', 'equalto', 'failed') | map(attribute='error'))
                 | map('join', ': ') | join('; ') }}
      always:
        - name: Publish the drills as job artifacts
          ansible.builtin.set_stats:
            aggregate: false
            per_host: false
            data: >-
              {{ {'drills': drills_done | default([]),
                  'failed_count': drills_done | default([]) | selectattr('result', 'equalto', 'failed') | list | length,
                  'skipped_count': drills_done | default([]) | selectattr('result', 'equalto', 'skipped') | list | length} }}
          run_once: true
          delegate_to: localhost
