---
# Light (or clear) the identify LED on a hardware component and record it.
# Called by the health rulebook with target_array, component, component_type,
# component_status, component_details, led_state and alert_log; the
# Alertmanager rulebook also passes `severity` (the alert's label), which
# overrides the severity otherwise derived from component_status.
# Needs everpure.flasharray >= 1.46.0: earlier purefa_hardware releases sent
# an empty PATCH body and the LED never changed. Components without an
# identify LED make the module fail; that is recorded and the notification
# still goes out.
- name: Identify LED on a hardware component
  hosts: "{{ target_array }}"
  gather_facts: false
  tasks:
    - name: Refuse a host pattern that is not exactly this array
      ansible.builtin.assert:
        that:
          - inventory_hostname == target_array
        fail_msg: "target_array {{ target_array | string | truncate(80) }} is a host pattern, not one inventory array"

    - name: Set the identify LED
      everpure.flasharray.purefa_hardware:
        fa_url: "{{ fa_url }}"
        api_token: "{{ api_token }}"
        disable_warnings: true
        name: "{{ component }}"
        enabled: "{{ led_state | default(true) | bool }}"
      register: led_result
      ignore_errors: true

    - name: Record the action
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'hardware',
              'severity': severity | default('critical' if component_status | default('') in ['critical', 'unhealthy', 'failed'] else 'warning'),
              'array': inventory_hostname, 'component': component,
              'type': component_type | default(''), 'status': component_status | default(''),
              'details': component_details | default(''),
              'identify_led': 'on' if led_state | default(true) | bool else 'off',
              'led_changed': led_result.changed | default(false),
              'led_error': (led_result.msg | default('')) if led_result.failed | default(false) else ''} | to_json }}
      delegate_to: localhost

    - name: Show the action
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} {{ component }} ({{ component_type | default('') }}) is {{ component_status | default('') }};
          identify LED {{ 'on' if led_state | default(true) | bool else 'off' }}
          {{ '(failed: ' ~ led_result.msg ~ ')' if led_result.failed | default(false)
             else '(changed)' if led_result.changed | default(false) else '(unchanged)' }}
