---
# One DR drill (included by dr_drill.yml with `drill`). Runs on localhost and
# delegates the array work to the target array's inventory host. Whatever
# happens a dr_drill record is written: no completed snapshot, a copy that
# fails or a size mismatch is recorded as critical (the signal that a DR plan
# has silently stopped working), the copy is destroyed on every path, and the
# rescue clears the failure so dr_drill.yml carries on with the next drill.
- name: Start the drill with a clean slate
  ansible.builtin.set_fact:
    drill_copy: "{{ drill.prefix | default('eda-drill') }}-{{ drill.pgroup }}"
    drill_snap: {}
    drill_result: {}
    drill_error: ""

- name: Find, copy and verify, then record whatever happened
  block:
    - name: Find the latest completed replicated snapshot of {{ drill.source_array ~ ':' ~ drill.pgroup ~ ' on ' ~ drill.target_array }}
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -"
        stdin: |
          import json, os, urllib3
          urllib3.disable_warnings()
          from pypureclient import flasharray
          c = flasharray.Client(target=os.environ["FA_HOST"], api_token=os.environ["FA_TOKEN"], verify_ssl=False)
          pg = os.environ["SOURCE"] + ":" + os.environ["PGROUP"]
          done = [t for t in c.get_protection_group_snapshots_transfer(filter=f"name='{pg}.*'", limit=50).items if t.completed]
          if not done:
              print(json.dumps({"error": f"no completed transfer for {pg}"})); raise SystemExit(0)
          latest = max(done, key=lambda t: t.completed)
          members = [v.name for v in c.get_volume_snapshots(filter=f"name='{latest.name}.*'").items]
          want = os.environ.get("VOLUME") or ""
          pick = next((m for m in members if m.endswith("." + want)), members[0] if members else None)
          print(json.dumps({"snapshot": latest.name, "completed": latest.completed, "members": members, "volume_snapshot": pick,
                            "volume": pick.split(".", 2)[-1] if pick else None}))
      environment:
        FA_HOST: "{{ hostvars[drill.target_array].fa_url | regex_replace('^https?://', '') }}"
        FA_TOKEN: "{{ hostvars[drill.target_array].api_token }}"
        SOURCE: "{{ drill.source_array }}"
        PGROUP: "{{ drill.pgroup }}"
        VOLUME: "{{ drill.volume | default('') }}"
      register: find
      changed_when: false
      no_log: true

    - name: Parse the snapshot search
      ansible.builtin.set_fact:
        drill_snap: "{{ find.stdout | from_json }}"

    - name: Show the snapshot search
      ansible.builtin.debug:
        var: drill_snap

    - name: Fail the drill when there is nothing to copy
      when: drill_snap.error is defined or not (drill_snap.volume_snapshot | default(''))
      ansible.builtin.fail:
        msg: "{{ drill_snap.error | default('no member volume snapshot in ' ~ (drill_snap.snapshot | default(''))) }}"

    - name: Copy the member volume from the replicated snapshot
      everpure.flasharray.purefa_pgsnap:
        fa_url: "{{ hostvars[drill.target_array].fa_url }}"
        api_token: "{{ hostvars[drill.target_array].api_token }}"
        disable_warnings: true
        name: "{{ drill.source_array }}:{{ drill.pgroup }}"
        suffix: "{{ drill_snap.snapshot.split('.', 1)[1] }}"
        restore: "{{ drill_snap.volume }}"
        target: "{{ drill_copy }}"
        overwrite: true
        with_default_protection: false
        state: copy

    - name: Verify the copy exists and matches the snapshot size
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -"
        stdin: |
          import json, os, urllib3
          urllib3.disable_warnings()
          from pypureclient import flasharray
          c = flasharray.Client(target=os.environ["FA_HOST"], api_token=os.environ["FA_TOKEN"], verify_ssl=False)
          v = list(c.get_volumes(names=[os.environ["NAME"]]).items)
          s = list(c.get_volume_snapshots(names=[os.environ["SNAP"]]).items)
          print(json.dumps({"exists": bool(v), "size": v[0].provisioned if v else None, "snapshot_size": s[0].provisioned if s else None,
                            "size_matches": bool(v and s and v[0].provisioned == s[0].provisioned)}))
      environment:
        FA_HOST: "{{ hostvars[drill.target_array].fa_url | regex_replace('^https?://', '') }}"
        FA_TOKEN: "{{ hostvars[drill.target_array].api_token }}"
        NAME: "{{ drill_copy }}"
        SNAP: "{{ drill_snap.volume_snapshot }}"
      register: verify
      changed_when: false
      no_log: true

    - name: Parse the verification
      ansible.builtin.set_fact:
        drill_result: "{{ verify.stdout | from_json }}"

    - name: Fail the drill when the copy does not match the snapshot
      when: not drill_result.size_matches | default(false)
      ansible.builtin.fail:
        msg: "copy {{ drill_copy }} does not match {{ drill_snap.volume_snapshot }}: {{ drill_result }}"
  rescue:
    - name: Keep the failure for the record
      ansible.builtin.set_fact:
        drill_error: >-
          {{ ansible_failed_result.msg | default('drill failed') }}{{ (': ' ~ (ansible_failed_result.stderr_lines | last))
             if ansible_failed_result.stderr_lines | default([]) else '' }}
  always:
    - name: Destroy and eradicate the copy
      everpure.flasharray.purefa_volume:
        fa_url: "{{ hostvars[drill.target_array].fa_url }}"
        api_token: "{{ hostvars[drill.target_array].api_token }}"
        disable_warnings: true
        name: "{{ drill_copy }}"
        state: absent
        eradicate: true
      when: drill.target_array in hostvars  # a bad dr_drills entry is still recorded below
      register: cleanup
      failed_when: false  # the copy may never have been made; a copy that could not be destroyed is recorded

    - name: Record the drill
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'dr_drill',
              'severity': 'critical' if drill_error else ('warning' if cleanup.failed | default(false) else 'info'),
              'cleanup_error': (cleanup.msg | default('')) if cleanup.failed | default(false) else '',
              'array': drill.target_array, 'source_array': drill.source_array, 'pgroup': drill.pgroup,
              'snapshot': drill_snap.snapshot | default(''), 'snapshot_completed': drill_snap.completed | default(''),
              'volume': drill_snap.volume | default(''), 'copy': drill_copy,
              'result': drill_result | combine({'error': drill_error} if drill_error else {})} | to_json }}

    - name: Show the drill
      ansible.builtin.debug:
        msg: >-
          DR drill {{ drill.target_array }} <- {{ drill.source_array }}:{{ drill.pgroup }}:
          {{ 'FAILED ' ~ drill_error if drill_error
             else 'OK ' ~ drill_snap.snapshot ~ ' volume ' ~ drill_snap.volume ~ ' copied and verified' }}
