---
# Reapply the baseline management DNS configuration to one array.
# set_dns_tasks is the absolute path of playbooks/set_dns.yml (ansible-rulebook
# copies only the playbook to a temporary directory, so the task file is
# passed in as a var by the rulebook).
- name: Reapply baseline DNS
  hosts: "{{ target_array }}"
  gather_facts: false
  vars:
    dns_domain: "{{ baseline_dns_domain }}"
    dns_nameservers: "{{ baseline_dns_nameservers_csv.split(',') }}"
  tasks:
    - name: Set DNS domain and nameservers to baseline
      ansible.builtin.include_tasks:
        file: "{{ set_dns_tasks }}"

    - name: Record the remediation
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': lookup('pipe', 'date -Is'), 'kind': 'remediation', 'array': inventory_hostname,
              'setting': 'dns', 'observed': {'domain': observed_dns_domain | default(''), 'nameservers': observed_dns_nameservers | default('')},
              'applied': {'domain': dns_domain, 'nameservers': dns_nameservers},
              'changed': dns_result.changed} | to_json }}
      delegate_to: localhost
