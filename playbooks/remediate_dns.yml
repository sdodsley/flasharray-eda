---
# Reapply the baseline management DNS configuration to one array. Called by
# the config drift rulebook with target_array, baseline_dns_domain,
# baseline_dns_nameservers_csv, the observed values and alert_log.
- name: Reapply baseline DNS
  hosts: "{{ target_array }}"
  gather_facts: false
  vars:
    baseline_dns_nameservers: "{{ baseline_dns_nameservers_csv.split(',') }}"
  tasks:
    - name: Resolve this array's credentials (inventory, per-array credential or fleet credential)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/resolve_array.yml"
      vars:
        resolve_array_name: "{{ inventory_hostname }}"

    # On Ansible Automation Platform the FlashArray API credential injects
    # credential_array and fa_url/api_token point at that array whatever
    # host this play runs on, so another array's credential is refused.
    - name: Refuse to run with another array's credential attached
      ansible.builtin.assert:
        that:
          - credential_array is not defined or credential_array == inventory_hostname
        fail_msg: "the attached credential is for {{ credential_array | default('') }}, not {{ inventory_hostname }}"

    - name: Set DNS domain and nameservers to baseline
      everpure.flasharray.purefa_dns:
        fa_url: "{{ fa_url }}"
        api_token: "{{ api_token }}"
        disable_warnings: true
        name: management
        domain: "{{ baseline_dns_domain }}"
        nameservers: "{{ baseline_dns_nameservers }}"
      register: dns_result

    - name: Record the remediation
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'remediation',
              'severity': 'warning' if dns_result.changed else 'info', 'array': inventory_hostname,
              'setting': 'dns',
              'observed': {'domain': observed_dns_domain | default(''),
                           'nameservers': (observed_dns_nameservers | default('')).split(',') | reject('equalto', '') | list},
              'applied': {'domain': baseline_dns_domain, 'nameservers': baseline_dns_nameservers},
              'changed': dns_result.changed} | to_json }}
      delegate_to: localhost
