---
# Apply the git baseline forward to every array that has a baseline file.
# Called by the change control rulebook on a git push webhook (git_ref,
# git_after) or by hand:
#   ansible-playbook -i inventory/local-lab.yml playbooks/apply_baseline.yml \
#       -e baseline_dir=/opt/flasharray-eda-baseline -e alert_log=$PWD/alerts.log
# When baseline_dir is a git checkout it is fast-forwarded first and the
# commit actually applied is recorded as git_head beside the git_after the
# webhook asked for; a pull that cannot fast-forward fails the run before
# anything is applied from a stale checkout.
- name: Refresh the baseline checkout
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check whether the baseline directory is a git checkout
      ansible.builtin.stat:
        path: "{{ baseline_dir }}/.git"
      register: baseline_git

    # A checkout with no upstream (a local-only baseline repository) has
    # nothing to pull from; one with an upstream must fast-forward cleanly.
    - name: Check whether the checkout tracks an upstream branch  # noqa: command-instead-of-module
      when: baseline_git.stat.exists
      ansible.builtin.command:
        cmd: git rev-parse --abbrev-ref --symbolic-full-name "@{upstream}"
        chdir: "{{ baseline_dir }}"
      register: baseline_upstream
      changed_when: false
      failed_when: false

    # ansible.builtin.git needs repo:; this only fast-forwards an existing
    # checkout, so a diverged branch or an unreachable remote fails here.
    - name: Pull the baseline repository  # noqa: command-instead-of-module
      when: baseline_git.stat.exists and baseline_upstream.rc == 0
      ansible.builtin.command:
        cmd: git pull --ff-only
        chdir: "{{ baseline_dir }}"
      register: pull
      changed_when: "'Already up to date' not in pull.stdout"

    - name: Record the commit the checkout is at  # noqa: command-instead-of-module
      when: baseline_git.stat.exists
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ baseline_dir }}"
      register: baseline_head
      changed_when: false

- name: Apply the baseline to each array
  hosts: all:!localhost
  gather_facts: false
  vars:
    baseline_file: "{{ baseline_dir }}/{{ inventory_hostname }}.yml"
  tasks:
    # On Ansible Automation Platform a per-array FlashArray API credential
    # injects credential_array; its fa_url and api_token override every
    # host's, so only that array's own baseline may be applied by this job.
    # The other hosts end here (not fail: an assert would fail every
    # multi-array launch), which also drops them from ansible_play_hosts so
    # the set_stats below reports only the arrays that ran. With the fleet
    # credential instead, credential_array is undefined until each host
    # resolves its own entry, so one launch applies every array in the limit
    # that the fleet lists.
    - name: Skip the arrays whose credential is not attached
      when: credential_array is defined and credential_array != inventory_hostname
      ansible.builtin.meta: end_host

    - name: Resolve this array's credentials (inventory, per-array credential or fleet credential)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/resolve_array.yml"
      vars:
        resolve_array_name: "{{ inventory_hostname }}"

    - name: Check for a baseline file
      ansible.builtin.stat:
        path: "{{ baseline_file }}"
      delegate_to: localhost
      register: bl

    - name: Apply the baseline
      when: bl.stat.exists
      block:
        - name: Load the baseline
          ansible.builtin.include_vars:
            file: "{{ baseline_file }}"
            name: baseline

        - name: NTP
          when: baseline.ntp_servers is defined
          everpure.flasharray.purefa_ntp:
            fa_url: "{{ fa_url }}"
            api_token: "{{ api_token }}"
            disable_warnings: true
            state: present
            ntp_servers: "{{ baseline.ntp_servers }}"
          register: ntp_result

        - name: DNS
          when: baseline.dns is defined
          everpure.flasharray.purefa_dns:
            fa_url: "{{ fa_url }}"
            api_token: "{{ api_token }}"
            disable_warnings: true
            name: management
            domain: "{{ baseline.dns.domain }}"
            nameservers: "{{ baseline.dns.nameservers }}"
          register: dns_result

        # This task runs in the array host's variable context (it is only
        # delegated to localhost), so the pull result comes via hostvars.
        - name: Record the apply
          ansible.builtin.lineinfile:
            path: "{{ alert_log }}"
            create: true
            mode: "0600"
            line: >-
              {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'baseline_apply',
                  'severity': 'info', 'array': inventory_hostname,
                  'git_ref': git_ref | default('manual'), 'git_after': git_after | default(''),
                  'git_head': hostvars['localhost'].baseline_head.stdout | default(''),
                  'ntp_changed': ntp_result.changed | default(false),
                  'dns_changed': dns_result.changed | default(false)} | to_json }}
          delegate_to: localhost

    # Job artifacts for a workflow or orchestrator node that follows this one.
    # One set for the whole run: the task runs once, after every array has
    # been through the block above, and reads the other arrays' results from
    # hostvars (an array without a baseline file has no ntp_result or
    # dns_result and counts as unchanged).
    - name: Publish what changed as job artifacts
      ansible.builtin.set_stats:
        aggregate: false
        per_host: false
        data: >-
          {{ {'git_head': hostvars['localhost'].baseline_head.stdout | default(''),
              'ntp_changed': (ansible_play_hosts | map('extract', hostvars) | selectattr('ntp_result.changed', 'defined')
                              | selectattr('ntp_result.changed') | list | length) > 0,
              'dns_changed': (ansible_play_hosts | map('extract', hostvars) | selectattr('dns_result.changed', 'defined')
                              | selectattr('dns_result.changed') | list | length) > 0,
              'arrays_changed': (ansible_play_hosts | map('extract', hostvars) | selectattr('ntp_result.changed', 'defined')
                                 | selectattr('ntp_result.changed') | map(attribute='inventory_hostname') | list)
                                | union(ansible_play_hosts | map('extract', hostvars) | selectattr('dns_result.changed', 'defined')
                                        | selectattr('dns_result.changed') | map(attribute='inventory_hostname') | list)} }}
      run_once: true
      delegate_to: localhost
