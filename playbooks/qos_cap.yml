---
# Apply or lift a temporary IOPS cap on a volume and keep the state on the
# array as tags (namespace eda: qos_cap = when it was applied, qos_prev_iops =
# the limit before). Called by the performance rulebook with target_array,
# volume, mode (cap | lift), cap_iops, reason and alert_log.
#
# The cap uses everpure.flasharray.purefa_volume (iops_qos) and the tags
# everpure.flasharray.purefa_volume_tags; both need everpure.flasharray
# >= 1.46.0 (earlier purefa_volume_tags truncated values at a colon, which
# an ISO timestamp contains). The pre-read of the volume's QoS and tags stays
# on the SDK: no module reads one volume's tags. In cap mode the tag is
# written before the limit, so a volume is never capped without the tag the
# plugin and the lift rule depend on. Lifting restores the previous IOPS
# limit carried in the tag, or clears it (module value 0, which the array
# stores as its "no limit" value 100000000).
- name: Volume QoS cap with hysteresis
  hosts: "{{ target_array }}"
  gather_facts: false
  tasks:
    - name: Read the volume's current QoS and cap tags
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -"
        stdin: |
          import json, os, urllib3
          urllib3.disable_warnings()
          from pypureclient import flasharray
          c = flasharray.Client(target=os.environ["FA_HOST"], api_token=os.environ["FA_TOKEN"], verify_ssl=False)
          # to_dict(): SDK models raise AttributeError for fields the array did not return
          v = list(c.get_volumes(names=[os.environ["VOL"]]).items)[0].to_dict()
          q = v.get("qos") or {}
          tags = {t.key: t.value for t in c.get_volumes_tags(resource_names=[os.environ["VOL"]], namespaces=["eda"]).items}
          print(json.dumps({"iops_limit": q.get("iops_limit"), "bw_limit": q.get("bandwidth_limit"), "tags": tags}))
      environment:
        FA_HOST: "{{ fa_url | regex_replace('^https?://', '') }}"
        FA_TOKEN: "{{ api_token }}"
        VOL: "{{ volume }}"
      register: before_cmd
      changed_when: false
      no_log: true

    - name: Parse
      ansible.builtin.set_fact:
        before: "{{ before_cmd.stdout | from_json }}"

    - name: Show the volume before the change
      ansible.builtin.debug:
        var: before

    - name: Apply the cap
      when: mode == 'cap'
      block:
        - name: Tag the volume first so the plugin and operators can see the cap
          everpure.flasharray.purefa_volume_tags:
            fa_url: "{{ fa_url }}"
            api_token: "{{ api_token }}"
            disable_warnings: true
            name: "{{ volume }}"
            namespace: eda
            kvp:
              - "qos_cap:{{ now(utc=true).isoformat(timespec='seconds') }}"
              - "qos_prev_iops:{{ before.iops_limit | default('none', true) }}"
          register: tagged

        - name: Set the IOPS limit
          everpure.flasharray.purefa_volume:
            fa_url: "{{ fa_url }}"
            api_token: "{{ api_token }}"
            disable_warnings: true
            name: "{{ volume }}"
            iops_qos: "{{ cap_iops }}"
          register: capped

    - name: Lift the cap
      when: mode == 'lift'
      block:
        - name: Restore the previous IOPS limit, or clear it
          everpure.flasharray.purefa_volume:
            fa_url: "{{ fa_url }}"
            api_token: "{{ api_token }}"
            disable_warnings: true
            name: "{{ volume }}"
            iops_qos: "{{ '0' if before.tags.qos_prev_iops | default('none') in ['none', 'None', '', '100000000'] else before.tags.qos_prev_iops }}"
          register: lifted

        - name: Remove the cap tags
          everpure.flasharray.purefa_volume_tags:
            fa_url: "{{ fa_url }}"
            api_token: "{{ api_token }}"
            disable_warnings: true
            name: "{{ volume }}"
            namespace: eda
            tag: [qos_cap, qos_prev_iops]
            state: absent
          register: untagged

    - name: Record the action
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'qos_cap', 'severity': 'warning' if mode == 'cap' else 'info',
              'array': inventory_hostname, 'volume': volume, 'mode': mode,
              'cap_iops': cap_iops | default(''), 'previous_iops_limit': before.iops_limit,
              'reason': reason | default('') | trim,
              'changed': (capped.changed | default(false)) or (lifted.changed | default(false)),
              'tag_changed': (tagged.changed | default(false)) or (untagged.changed | default(false))} | to_json }}
      delegate_to: localhost

    - name: Show the action
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}/{{ volume }}: QoS {{ mode }}
          {{ '(' ~ cap_iops ~ ' IOPS)' if mode == 'cap' else '' }} :: {{ reason | default('') | trim }}
