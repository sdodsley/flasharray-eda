---
# Act on an approved capacity request. Reads request_dir/<request_id>.json
# (written by capacity_request.yml), checks it is still awaiting approval,
# performs the approved action and marks the request done.
#
# Actions:
#   eradicate_pending  eradicate the volumes and volume snapshots the request
#                      listed as candidates, and only those still in pending
#                      eradication now. Anything recovered, or already
#                      eradicated by the array's own timer, since the request
#                      was raised is reported as skipped; objects under a
#                      SafeMode retention lock are refused by the array and
#                      reported, never forced.
# request_id arrives in a webhook body, so it is checked against the shape
# capacity_request.yml generates (<array>-<digits>) before it is used in a
# path.
# On Ansible Automation Platform this runs as a later job than the request,
# usually in a fresh execution environment whose request_dir is empty
# (aap/README.md, "Paths inside the execution environment"). The launching
# workflow or orchestrator node then passes the request job's artifacts,
# array (or at_risk_array) and candidates, together with
# rebuild_from_artifacts: true, and the request is rebuilt from them before
# it is loaded; an approval still eradicates only what the request listed.
# Without that flag a missing request file is refused, so a direct launch
# of the job template cannot name its own candidates. A request file that
# is there wins over the extra vars, and the alert-log record and the
# artifacts say when a request was rebuilt (rebuilt_from).
# Run twice: a request already done with the same action is not refused; the
# first run's result is republished with already_done true and nothing is
# sent to the array. A rebuilt request whose candidates are all gone reports
# nothing_pending true.
- name: Reclaim capacity on an approved request
  hosts: localhost
  gather_facts: false
  vars:
    request_file: "{{ request_dir }}/{{ request_id }}.json"
  tasks:
    - name: Refuse a request id that is not a plain file name
      ansible.builtin.assert:
        that:
          - request_id is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
        fail_msg: "request id {{ request_id | string | truncate(80) }} is not a valid request id"

    - name: See whether the request file is there
      ansible.builtin.set_fact:
        request_from_artifacts: "{{ request_file is not file }}"

    # Only the controller-tier workflow and the orchestrator's reclaim node
    # set rebuild_from_artifacts; without it a missing request file is a
    # refusal, so a direct launch of the job template cannot supply its own
    # candidate list.
    - name: Refuse a missing request file unless the launcher may rebuild it from artifacts
      when: request_from_artifacts | bool
      ansible.builtin.assert:
        that:
          - rebuild_from_artifacts | default(false) | bool
        fail_msg: "{{ request_file }} does not exist and rebuild_from_artifacts is not true: only a workflow or orchestrator node that passes the request job's artifacts may rebuild a request; nothing eradicated"

    - name: Rebuild the request from the job artifacts when the request file is absent
      when: request_from_artifacts | bool and rebuild_from_artifacts | default(false) | bool
      block:
        - name: Refuse a rebuild without the array and the candidates
          ansible.builtin.assert:
            that:
              - (array | default(at_risk_array | default(''))) is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
              - candidates is defined and candidates is mapping
            fail_msg: "{{ request_file }} does not exist and the extra vars array (or at_risk_array) and candidates, the request job's artifacts, are not both set (rebuild_from_artifacts is true)"

        - name: Make sure the request directory exists
          ansible.builtin.file:
            path: "{{ request_dir }}"
            state: directory
            mode: "0700"

        - name: Write the rebuilt request
          ansible.builtin.copy:
            dest: "{{ request_file }}"
            mode: "0600"
            content: >-
              {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'capacity_request',
                  'severity': 'warning', 'status': 'awaiting_approval', 'request_id': request_id,
                  'array': array | default(at_risk_array),
                  'candidates': {'volumes': candidates.volumes | default([]),
                                 'snapshots': candidates.snapshots | default([])},
                  'proposed_actions': ['eradicate_pending'], 'rebuilt_from': 'job artifacts'} | to_nice_json }}

    - name: Load the request
      ansible.builtin.set_fact:
        request: "{{ lookup('file', request_file) | from_json }}"

    - name: Resolve this array's credentials (inventory, per-array credential or fleet credential)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/resolve_array.yml"
      vars:
        resolve_array_name: "{{ request.array }}"

    # The FlashArray API credential on Ansible Automation Platform injects
    # credential_array; fa_url and api_token point at that array whatever
    # host the request names, so a mismatch is refused before anything is
    # eradicated.
    - name: Refuse to run with another array's credential attached
      ansible.builtin.assert:
        that:
          - credential_array is not defined or credential_array == request.array
        fail_msg: "the attached credential is for {{ credential_array | default('') }}, not {{ request.array }}; nothing eradicated"

    - name: Refuse anything that is not awaiting approval (or done with this very action) or not a proposed action
      ansible.builtin.assert:
        that:
          - >-
            request.status == 'awaiting_approval' or
            (request.status == 'done' and request.action | default('') == reclaim_action)
          - reclaim_action in request.proposed_actions
        fail_msg: "request {{ request_id }} is {{ request.status }} or does not propose {{ reclaim_action }}"

    - name: Note a request already done with this action
      ansible.builtin.set_fact:
        already_done: "{{ request.status == 'done' }}"

    - name: Eradicate the listed candidates that are still pending eradication
      when: reclaim_action == 'eradicate_pending' and not (already_done | bool)
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -"
        stdin: |
          import json, os, urllib3
          urllib3.disable_warnings()
          from pypureclient import flasharray
          c = flasharray.Client(target=os.environ["FA_HOST"], api_token=os.environ["FA_TOKEN"], verify_ssl=False)
          with open(os.environ["REQUEST_FILE"]) as f:
              cand = json.load(f).get("candidates") or {}
          pending = {"snapshot": {s.name for s in c.get_volume_snapshots(destroyed=True).items},
                     "volume": {v.name for v in c.get_volumes(destroyed=True).items}}
          done, refused, skipped = [], [], []
          for kind, names, delete in (("snapshot", cand.get("snapshots") or [], c.delete_volume_snapshots),
                                      ("volume", cand.get("volumes") or [], c.delete_volumes)):
              for n in names:
                  if n not in pending[kind]:
                      skipped.append({kind: n, "reason": "no longer pending eradication"})
                      continue
                  r = delete(names=[n])
                  if r.status_code == 200:
                      done.append({kind: n})
                  else:
                      refused.append({kind: n, "error": r.errors[0].message})
          print(json.dumps({"eradicated": done, "refused": refused, "skipped": skipped}))
      environment:
        FA_HOST: "{{ hostvars[request.array].fa_url | regex_replace('^https?://', '') }}"
        FA_TOKEN: "{{ hostvars[request.array].api_token }}"
        REQUEST_FILE: "{{ request_file }}"
      register: reclaim
      changed_when: (reclaim.stdout | from_json).eradicated | length > 0
      no_log: true

    - name: Parse the result (a request already done keeps its first result)
      ansible.builtin.set_fact:
        reclaim_result: >-
          {{ (request.result | default({'eradicated': [], 'refused': [], 'skipped': []})) if already_done | bool
             else (reclaim.stdout | default('{}') | from_json) }}

    - name: Mark the request done
      when: not (already_done | bool)
      ansible.builtin.copy:
        dest: "{{ request_file }}"
        mode: "0600"
        content: >-
          {{ request | combine({'status': 'done', 'approver': approver | default(''),
                                'action': reclaim_action, 'result': reclaim_result,
                                'done_at': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ')}) | to_nice_json }}

    - name: Record the outcome
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'capacity_reclaim', 'severity': 'info',
              'array': request.array, 'request_id': request_id, 'approver': approver | default(''),
              'action': reclaim_action, 'result': reclaim_result, 'already_done': already_done | bool,
              'nothing_pending': (reclaim_result.eradicated | default([]) | length) == 0
                                 and (reclaim_result.refused | default([]) | length) == 0
                                 and (reclaim_result.skipped | default([]) | length) > 0,
              'rebuilt_from': request.rebuilt_from | default('')} | to_json }}

    - name: Show the outcome
      ansible.builtin.debug:
        msg: >-
          request {{ request_id }} approved by {{ approver | default('?') }}: {{ reclaim_action }} on {{ request.array }}
          {{ '(already done, first result republished) ->' if already_done | bool else '->' }}
          eradicated {{ reclaim_result.eradicated | default([]) | length }},
          refused {{ reclaim_result.refused | default([]) | length }},
          skipped {{ reclaim_result.skipped | default([]) | length }}: {{ reclaim_result }}

    # Job artifacts for a workflow or orchestrator node that follows this one:
    # result is done (nothing refused), partial (some refused) or refused
    # (nothing eradicated); the lists carry {volume|snapshot: name} entries as
    # the alert-log record does; rebuilt_from is 'job artifacts' when the
    # request was rebuilt from the launcher's extra vars, else empty.
    - name: Publish the outcome as job artifacts
      ansible.builtin.set_stats:
        aggregate: false
        per_host: false
        data: >-
          {{ {'request_id': request_id, 'array': request.array,
              'rebuilt_from': request.rebuilt_from | default(''),
              'already_done': already_done | bool,
              'nothing_pending': (reclaim_result.eradicated | default([]) | length) == 0
                                 and (reclaim_result.refused | default([]) | length) == 0
                                 and (reclaim_result.skipped | default([]) | length) > 0,
              'eradicated': reclaim_result.eradicated | default([]),
              'refused': reclaim_result.refused | default([]),
              'result': ('done' if (reclaim_result.refused | default([]) | length) == 0
                         else ('partial' if (reclaim_result.eradicated | default([]) | length) > 0 else 'refused'))} }}
      run_once: true
      delegate_to: localhost
