---
# Capacity approval request. Deliberately frees nothing: it writes a request
# file (request_dir/<id>.json) describing the array, the days-to-full
# estimate, the fastest-growing volumes, what is pending eradication and the
# other arrays with headroom, and records it in the alert log. The names of
# the destroyed volumes and snapshots are read here (one read-only SDK call)
# and stored as `candidates`: an approval may later eradicate those and
# nothing destroyed since. An approver answers through the capacity approvals
# webhook (see the capacity rulebook) or, in Ansible Automation Platform,
# through the workflow approval node.
# Run twice: the request id is keyed on request_key when the launcher passes
# one (the orchestrator node passes the event's observed_at, the rulebook the
# event's received_at), so a retried launch computes the same id; and a
# request already awaiting approval for the array in request_dir is reused:
# nothing is written, the record says already_raised, and the artifacts carry
# that request's id and candidates.
- name: Raise a capacity approval request
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Refuse an array name that is not a plain file name
      ansible.builtin.assert:
        that:
          - at_risk_array is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
        fail_msg: "array name {{ at_risk_array | string | truncate(80) }} is not a valid array name"

    - name: Resolve this array's credentials (inventory, per-array credential or fleet credential)
      when: at_risk_array in hostvars
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/resolve_array.yml"
      vars:
        resolve_array_name: "{{ at_risk_array }}"

    # On Ansible Automation Platform the FlashArray API credential injects
    # credential_array, the array it belongs to; fa_url and api_token then
    # point at that array whatever host name is used, so a request for any
    # other array is refused instead of listing the wrong array's candidates.
    - name: Refuse to run with another array's credential attached
      ansible.builtin.assert:
        that:
          - credential_array is not defined or credential_array == at_risk_array
        fail_msg: "the attached credential is for {{ credential_array | default('') }}, not {{ at_risk_array }}"

    - name: Pin the request id and time
      ansible.builtin.set_fact:
        request_time: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
        request_id: >-
          {{ at_risk_array ~ '-' ~ ((request_key | string | regex_replace('[^0-9A-Za-z]', ''))
             if request_key | default('') | string | length > 0
             else now(utc=true).strftime('%Y%m%d%H%M%S')) }}

    - name: Make sure the request directory exists
      ansible.builtin.file:
        path: "{{ request_dir }}"
        state: directory
        mode: "0700"

    - name: Look for a request already awaiting approval for this array
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -"
        stdin: |
          import glob, json, os
          d, arr, keyed = os.environ["DIR"], os.environ["ARR"], os.environ["KEYED"]
          def load(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except Exception:
                  return None
          # the keyed file first, whatever its status (a retry after the
          # request was done must not reopen it), then any request still
          # awaiting approval for the array
          found = load(os.path.join(d, keyed + ".json"))
          if not found:
              for path in sorted(glob.glob(os.path.join(d, arr + "-*.json")), reverse=True):
                  r = load(path)
                  if r and r.get("status") == "awaiting_approval" and r.get("array") == arr:
                      found = r
                      break
          print(json.dumps({"open": found["request_id"] if found else None,
                            "status": (found or {}).get("status"),
                            "candidates": (found or {}).get("candidates")}))
      environment:
        DIR: "{{ request_dir }}"
        ARR: "{{ at_risk_array }}"
        KEYED: "{{ request_id }}"
      register: open_cmd
      changed_when: false

    - name: Reuse the open request when there is one
      ansible.builtin.set_fact:
        open_request: "{{ open_cmd.stdout | from_json }}"
        request_open: "{{ (open_cmd.stdout | from_json).open is not none }}"
        request_id: "{{ (open_cmd.stdout | from_json).open | default(request_id, true) }}"

    # The Alertmanager path may name an array that is not in the inventory,
    # and a failed read must not lose the request: the candidate list is then
    # empty (an approval eradicates nothing) and the error is recorded.
    - name: List what is pending eradication on the array (the reclaim candidates)
      when: at_risk_array in hostvars and not (request_open | bool)
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -"
        stdin: |
          import json, os, urllib3
          urllib3.disable_warnings()
          from pypureclient import flasharray
          c = flasharray.Client(target=os.environ["FA_HOST"], api_token=os.environ["FA_TOKEN"], verify_ssl=False)
          print(json.dumps({"volumes": [v.name for v in c.get_volumes(destroyed=True).items],
                            "snapshots": [s.name for s in c.get_volume_snapshots(destroyed=True).items]}))
      environment:
        FA_HOST: "{{ hostvars[at_risk_array].fa_url | regex_replace('^https?://', '') }}"
        FA_TOKEN: "{{ hostvars[at_risk_array].api_token }}"
      register: candidates_cmd
      changed_when: false
      failed_when: false
      no_log: true

    - name: Parse the candidates (an open request keeps the ones it listed)
      ansible.builtin.set_fact:
        candidates: >-
          {{ (open_request.candidates | default({'volumes': [], 'snapshots': []}, true)) if request_open | bool
             else ((candidates_cmd.stdout | from_json) if (candidates_cmd.rc | default(1)) == 0 else {'volumes': [], 'snapshots': []}) }}
        candidates_error: >-
          {{ '' if (request_open | bool or (candidates_cmd.rc | default(1)) == 0)
             else (candidates_cmd.stderr_lines | default([]) | last | default(at_risk_array ~ ' is not in the inventory')) }}

    - name: Build the request
      ansible.builtin.set_fact:
        capacity_request:
          time: "{{ request_time }}"
          kind: capacity_request
          severity: warning
          status: >-
            {{ (('already_raised' if open_request.status == 'awaiting_approval' else 'already_' ~ open_request.status)
                if request_open | bool else 'awaiting_approval') }}
          request_id: "{{ request_id }}"
          array: "{{ at_risk_array }}"
          used_pct: "{{ used_pct | default('') }}"
          used_bytes: "{{ used_bytes | default('') }}"
          capacity_bytes: "{{ capacity_bytes | default('') }}"
          days_to_full: "{{ days_to_full | default('') }}"
          top_growers: "{{ top_growers | default([]) }}"
          pending_eradication_volumes: "{{ pending_eradication_volumes | default(candidates.volumes | length) }}"
          pending_eradication_snapshots: "{{ pending_eradication_snapshots | default(candidates.snapshots | length) }}"
          candidates: "{{ candidates }}"
          candidates_error: "{{ candidates_error | trim }}"
          candidate_targets: "{{ candidate_targets | default([]) }}"
          proposed_actions:
            - eradicate_pending

    - name: Write the request file
      when: not (request_open | bool)
      ansible.builtin.copy:
        dest: "{{ request_dir }}/{{ request_id }}.json"
        mode: "0600"
        content: "{{ capacity_request | to_nice_json }}"

    - name: Append to the alert log
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: "{{ capacity_request | to_json }}"

    - name: Show the request
      ansible.builtin.debug:
        msg: >-
          Capacity request {{ request_id }}{{ ' (already awaiting approval, reused)' if request_open | bool else '' }}:
          {{ at_risk_array }} at {{ used_pct | default('?') }}% used
          (full in {{ days_to_full | default('n/a') }} days);
          candidates pending eradication: {{ candidates.volumes | length }} volumes /
          {{ candidates.snapshots | length }} snapshots{{ (' (' ~ candidates_error | trim ~ ')') if candidates_error | trim else '' }};
          arrays with headroom: {{ candidate_targets | default([]) | map(attribute='array') | list }}

    # Job artifacts: an Ansible Automation Platform workflow passes them to
    # the next node as extra_vars (request_id reaches capacity_reclaim.yml
    # that way) and an orchestrator aap_job_template node reads them as
    # ${<node>.artifacts.request_id}. candidates is the request file's own
    # {volumes, snapshots} dict, in full: a reclaim job that cannot see this
    # job's request_dir rebuilds the request from it (capacity_reclaim.yml),
    # so what it holds is exactly what an approval may eradicate. The data
    # is one templated dict so that counts arrive as numbers, not strings.
    - name: Publish the request as job artifacts
      ansible.builtin.set_stats:
        aggregate: false
        per_host: false
        data: >-
          {{ {'request_id': request_id, 'at_risk_array': at_risk_array,
              'candidate_count': (candidates.volumes | length) + (candidates.snapshots | length),
              'candidates': candidates, 'already_raised': request_open | bool} }}
      run_once: true
      delegate_to: localhost
