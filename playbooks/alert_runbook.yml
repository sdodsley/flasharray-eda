---
# Route an array alert through the alert-code runbook map and raise a
# ticket record carrying the array's own action text and KB link.
#
# The alerts rulebook passes the alert fields plus `alert_runbooks` (a map of
# alert code -> {severity, route, note}) and `alert_runbooks_by_type` (the
# same, by the alert's component_type). The entry is looked up by code, then
# by component type, then `default`. `route` is one of:
#   notify   -> alert log only (same shape as notify.yml)
#   ticket   -> alert log + a ticket record; swap the lineinfile for
#               servicenow.itsm.incident or jira when connected
#   tasks    -> also include runbooks/<code>.yml from beside this playbook
#               (ansible-rulebook copies the playbook's whole directory into
#               its project dir, so the relative path resolves)
- name: Alert runbook
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Pick the runbook entry for this alert code, else its component type, else the default
      ansible.builtin.set_fact:
        runbook: >-
          {{ alert_runbooks[alert_code | string]
             | default((alert_runbooks_by_type | default({}))[component_type | default('')]
                       | default(alert_runbooks['default'])) }}

    # Only the per-code tasks can touch the array (they delegate to it and
    # read hostvars[target_array]); a notify or ticket route needs nothing.
    - name: Resolve this array's credentials (inventory, per-array credential or fleet credential)
      when: runbook.route == 'tasks' and target_array in hostvars
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/resolve_array.yml"
      vars:
        resolve_array_name: "{{ target_array }}"

    - name: Build the record
      ansible.builtin.set_fact:
        alert_record:
          time: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
          kind: "{{ 'ticket' if runbook.route in ['ticket', 'tasks'] else 'notify' }}"
          # the key a ticket backend deduplicates on: a repeat launch for the
          # same alert and transition carries the same one
          ticket_key: "{{ target_array }}:{{ alert_id | default('') }}:{{ transition | default('opened') }}"
          severity: "{{ runbook.severity | default(severity) }}"
          array: "{{ target_array }}"
          alert_id: "{{ alert_id }}"
          alert_code: "{{ alert_code }}"
          transition: "{{ transition | default('opened') }}"
          subject: "{{ subject }}"
          component: "{{ component | default('') }}"
          array_action: "{{ array_action | default('') }}"
          knowledge_base_url: "{{ knowledge_base_url | default('') }}"
          runbook_note: "{{ runbook.note | default('') }}"
          route: "{{ runbook.route }}"

    - name: Append to the alert log
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: "{{ alert_record | to_json }}"

    - name: Run the per-code runbook tasks
      when: runbook.route == 'tasks'
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/runbooks/{{ alert_code }}.yml"

    - name: Show the record
      ansible.builtin.debug:
        msg: >-
          [{{ alert_record.severity | upper }}] {{ alert_record.route }} :: {{ alert_record.subject }} ::
          {{ alert_record.array_action }} {{ alert_record.knowledge_base_url }} {{ alert_record.runbook_note }}
