---
# Reapply the baseline NTP servers to one array. Called by the config drift
# rulebook with target_array, baseline_ntp_servers_csv, observed_ntp_servers
# and alert_log as extra_vars.
- name: Reapply baseline NTP servers
  hosts: "{{ target_array }}"
  gather_facts: false
  vars:
    baseline_ntp_servers: "{{ baseline_ntp_servers_csv.split(',') }}"
  tasks:
    - name: Set NTP servers to baseline
      everpure.flasharray.purefa_ntp:
        fa_url: "{{ fa_url }}"
        api_token: "{{ api_token }}"
        disable_warnings: true
        state: present
        ntp_servers: "{{ baseline_ntp_servers }}"
      register: ntp_result

    - name: Record the remediation
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: >-
          {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'), 'kind': 'remediation',
              'severity': 'warning' if ntp_result.changed else 'info', 'array': inventory_hostname,
              'setting': 'ntp_servers',
              'observed': {'servers': (observed_ntp_servers | default('')).split(',') | reject('equalto', '') | list},
              'applied': {'servers': baseline_ntp_servers}, 'changed': ntp_result.changed} | to_json }}
      delegate_to: localhost
