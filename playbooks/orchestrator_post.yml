---
# Hand one event to the automation orchestrator instead of acting on it here.
# Two HTTP calls: a client-credentials token from
# {orchestrator_url}/api/v1/auth/token, then the event to
# {orchestrator_url}/api/v1/webhooks/eda/{orchestrator_webhook_path}. The
# orchestrator passes the body through unwrapped, so the body is
# {"event": {...}} and a workflow node reads ${trigger.event.<field>}
# (the envelope is documented in docs/ORCHESTRATOR.md).
#
# Inputs (extra_vars from the rulebook): orchestrator_url,
# orchestrator_webhook_path, event (the whole rulebook event, that is
# {purefa_<type>: {...}, meta: {...}}), array, alert_log; optional
# orchestrator_validate_certs (default true) and orchestrator_timeout
# (seconds, default 30).
# Credentials: AO_CLIENT_ID and AO_CLIENT_SECRET from the environment
# (env.example; run.sh passes them on with --env-vars). The token lives 15
# minutes, is held in a no_log fact and is never written anywhere.
#
# Optional: orchestrator_fallback_local (default false). When true and the
# handoff of a purefa_capacity event produced no execution, the second play
# raises the local capacity request (capacity_request.yml, with request_dir)
# exactly as the standalone capacity rule would, so the approvals webhook
# can still answer it. Off by default: on a platform the request file would
# live in a job's /tmp and the webhook ruleset is not deployed there.
#
# Outcome: one alert-log record of kind orchestrator_post. Severity info on
# 202 (with the execution_id); warning on anything else, with the status and
# a one-line reason, including a body over 1000000 bytes, which is refused
# here without a request. A non-202 never fails the rulebook action: the
# record says the event was not handed over, and the rule's throttle decides
# when it may fire again. Missing credentials or a malformed event do fail,
# because they are configuration errors.
#
# Run twice: before posting, the executions still open (paused at an approval
# or running) are listed, and one carrying the same event type for the same
# array means the event is already being handled: the record says stage
# "pending" with that execution's id, severity info, and nothing is posted (a
# second post would raise a second approval). orchestrator_dedupe: false turns
# the check off; a listing that fails is not fatal, the post goes ahead.
- name: Hand an event to the automation orchestrator
  hosts: localhost
  gather_facts: false
  vars:
    orchestrator_validate_certs: true
    orchestrator_timeout: 30
    orchestrator_max_body_bytes: 1000000
    orchestrator_dedupe: true
    orchestrator_base: "{{ orchestrator_url | regex_replace('/+$', '') }}"
  tasks:
    - name: Read the service account credentials from the environment
      ansible.builtin.set_fact:
        ao_client_id: "{{ lookup('env', 'AO_CLIENT_ID') }}"
        ao_client_secret: "{{ lookup('env', 'AO_CLIENT_SECRET') }}"
      no_log: true

    - name: Refuse to run without AO_CLIENT_ID and AO_CLIENT_SECRET
      ansible.builtin.assert:
        that:
          - ao_client_id | length > 0
          - ao_client_secret | length > 0
        quiet: true
        fail_msg: >-
          AO_CLIENT_ID and AO_CLIENT_SECRET must both be set in the environment
          (see env.example; run.sh passes them to ansible-rulebook with
          --env-vars). Nothing was sent.

    - name: Refuse a malformed orchestrator URL or webhook path
      ansible.builtin.assert:
        that:
          - orchestrator_url is match('^https?://[^/\s]+')
          - orchestrator_webhook_path is match('^[A-Za-z0-9][A-Za-z0-9._/-]*$')
        quiet: true
        fail_msg: >-
          orchestrator_url must be an http(s) URL and orchestrator_webhook_path a
          plain path ({{ orchestrator_url | string | truncate(80) }},
          {{ orchestrator_webhook_path | string | truncate(80) }})

    - name: Identify the event type (the purefa_* key of the event)
      ansible.builtin.set_fact:
        purefa_keys: "{{ event | default({}) | dict2items | map(attribute='key') | select('match', '^purefa_') | list }}"

    - name: Refuse anything that is not a purefa_* event
      ansible.builtin.assert:
        that:
          - purefa_keys | length > 0
        quiet: true
        fail_msg: "event carries no purefa_* key (keys: {{ event | default({}) | dict2items | map(attribute='key') | list }})"

    - name: Pin the event type and its fields
      ansible.builtin.set_fact:
        event_type: "{{ purefa_keys | first }}"
        event_data: "{{ event[purefa_keys | first] }}"

    # The capacity event carries no maintenance_active (only alert, audit,
    # hardware and replication events do); it is reported as false then.
    - name: Build the envelope
      ansible.builtin.set_fact:
        envelope:
          event:
            schema: flasharray-eda/1
            event_type: "{{ event_type }}"
            array: "{{ array | default(event_data.array | default(''), true) }}"
            maintenance_active: "{{ event_data.maintenance_active | default(false) | bool }}"
            observed_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
            data: "{{ event_data }}"

    # to_json output is ASCII, so its length is the byte count; the uri
    # module serialises the same dict with the same defaults.
    - name: Measure the body
      ansible.builtin.set_fact:
        body_bytes: "{{ envelope | to_json | length }}"

    - name: Decide whether the body may be sent
      ansible.builtin.set_fact:
        oversize: "{{ body_bytes | int > orchestrator_max_body_bytes | int }}"

    - name: Obtain a service account token
      when: not oversize
      ansible.builtin.uri:
        url: "{{ orchestrator_base }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ ao_client_id }}"
          client_secret: "{{ ao_client_secret }}"
        headers:
          Accept: application/json
        status_code: [200]
        validate_certs: "{{ orchestrator_validate_certs | bool }}"
        timeout: "{{ orchestrator_timeout | int }}"
        return_content: true
      register: token_response
      failed_when: false
      no_log: true

    - name: Keep the token and the token outcome
      ansible.builtin.set_fact:
        ao_token: "{{ token_response.json.access_token | default('') }}"
        token_status: "{{ token_response.status | default(0) }}"
        token_reason: >-
          {{ token_response.json.detail | default(token_response.msg | default('no response'))
             | string | regex_replace('\s+', ' ') | truncate(240, true, '...', 0) }}
      no_log: true

    # One read-only call set, in Python: every page of the executions still
    # open (paused, running), matched on event type, array and the scope the
    # event names (protection group, volume, pod, component), so a second
    # overdue group on the same array is not mistaken for the first. A listing
    # that fails leaves pending_execution empty and the post goes ahead.
    - name: Look for an execution already handling this event
      when: not oversize and ao_token | length > 0 and orchestrator_dedupe | bool
      ansible.builtin.command:
        cmd: "{{ ansible_playbook_python }} -"
        stdin: |
          import json, os, ssl, urllib.parse, urllib.request
          base, tok = os.environ["ORCH_BASE"], os.environ["ORCH_TOKEN"]
          ctx = ssl.create_default_context()
          if os.environ.get("VERIFY") == "0":
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE
          want_type, want_array = os.environ["EVENT_TYPE"], os.environ["ARRAY"]
          scope = json.loads(os.environ.get("SCOPE") or "{}")
          timeout = float(os.environ.get("TIMEOUT") or 30)
          def page(status, cursor):
              q = {"status": status, "limit": "100"}
              if cursor:
                  q["cursor"] = cursor
              req = urllib.request.Request(base + "/api/v1/executions?" + urllib.parse.urlencode(q),
                                           headers={"Authorization": "Bearer " + tok, "Accept": "application/json"})
              with urllib.request.urlopen(req, context=ctx, timeout=timeout) as r:
                  return json.loads(r.read() or b"{}")
          found = ""
          for status in ("paused", "running"):
              cursor = None
              for _ in range(50):
                  body = page(status, cursor)
                  for e in body.get("resources", []) or []:
                      ev = ((e.get("input_data") or {}).get("event") or {})
                      if ev.get("event_type") != want_type or ev.get("array") != want_array:
                          continue
                      data = ev.get("data") or {}
                      if all(str(data.get(k)) == str(v) for k, v in scope.items()):
                          found = e.get("id") or ""
                          break
                  cursor = body.get("next_cursor")
                  if found or not cursor:
                      break
              if found:
                  break
          print(json.dumps({"pending": found}))
      environment:
        ORCH_BASE: "{{ orchestrator_base }}"
        ORCH_TOKEN: "{{ ao_token }}"
        VERIFY: "{{ '1' if orchestrator_validate_certs | bool else '0' }}"
        TIMEOUT: "{{ orchestrator_timeout | int }}"
        EVENT_TYPE: "{{ event_type }}"
        ARRAY: "{{ envelope.event.array }}"
        SCOPE: "{{ event_data | dict2items | selectattr('key', 'in', ['pgroup', 'volume', 'pod', 'component']) | items2dict | to_json }}"
      register: dedupe_cmd
      changed_when: false
      failed_when: false
      no_log: true

    - name: Keep the execution found, if any
      ansible.builtin.set_fact:
        pending_execution: >-
          {{ ((dedupe_cmd.stdout | from_json).pending | default(''))
             if (dedupe_cmd.rc | default(1)) == 0 and (dedupe_cmd.stdout | default('')) | length > 0 else '' }}

    - name: Post the event
      when: not oversize and ao_token | length > 0 and pending_execution | length == 0
      ansible.builtin.uri:
        url: "{{ orchestrator_base }}/api/v1/webhooks/eda/{{ orchestrator_webhook_path }}"
        method: POST
        headers:
          Authorization: "Bearer {{ ao_token }}"
          Accept: application/json
        body_format: json
        body: "{{ envelope }}"
        status_code: [202]
        validate_certs: "{{ orchestrator_validate_certs | bool }}"
        timeout: "{{ orchestrator_timeout | int }}"
        return_content: true
      register: post_response
      failed_when: false
      no_log: true

    - name: Keep the post outcome (status and execution id only)
      ansible.builtin.set_fact:
        post_status: "{{ post_response.status | default(0) }}"
        execution_id: "{{ post_response.json.execution_id | default(pending_execution) }}"
        post_reason: >-
          {{ post_response.json.detail | default(post_response.msg | default('no response'))
             | string | regex_replace('\s+', ' ') | truncate(240, true, '...', 0) }}
        stage: >-
          {{ 'size_check' if oversize else ('token' if ao_token | length == 0
             else ('pending' if pending_execution | length > 0 else 'post')) }}

    - name: Build the record
      ansible.builtin.set_fact:
        orchestrator_record: >-
          {{ {'time': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'kind': 'orchestrator_post',
              'severity': 'info' if (post_status | int == 202 or stage == 'pending') else 'warning',
              'array': envelope.event.array,
              'event_type': event_type,
              'webhook_path': orchestrator_webhook_path,
              'stage': stage,
              'status': none if stage in ['size_check', 'pending'] else (token_status | int if stage == 'token' else post_status | int),
              'execution_id': execution_id,
              'reason': ('body of ' ~ body_bytes ~ ' bytes exceeds the ' ~ orchestrator_max_body_bytes ~ ' byte limit; not sent') if stage == 'size_check'
                        else (('token request failed: ' ~ token_reason) if stage == 'token'
                              else (('execution ' ~ execution_id ~ ' is already handling this ' ~ event_type ~ ' for ' ~ envelope.event.array ~ '; nothing sent') if stage == 'pending'
                                    else ('' if post_status | int == 202 else post_reason))),
              'body_bytes': body_bytes | int} }}

    - name: Append to the alert log
      ansible.builtin.lineinfile:
        path: "{{ alert_log }}"
        create: true
        mode: "0600"
        line: "{{ orchestrator_record | to_json }}"

    - name: Show the outcome
      ansible.builtin.debug:
        msg: >-
          orchestrator handoff of {{ event_type }} for {{ envelope.event.array }}
          to {{ orchestrator_webhook_path }}: {{ orchestrator_record.stage }}
          status={{ orchestrator_record.status }}
          execution_id={{ orchestrator_record.execution_id | default('-', true) }}
          {{ orchestrator_record.reason }}

# The fallback: the local request for a capacity event the orchestrator did
# not take (see the header). Every task of the imported playbook carries the
# condition, so with the switch off or a 202 recorded nothing here runs.
- name: Fall back to the local capacity request when the handoff failed
  import_playbook: capacity_request.yml
  when:
    - orchestrator_fallback_local | default(false) | bool
    - hostvars['localhost'].event_type | default('') == 'purefa_capacity'
    - (hostvars['localhost'].orchestrator_record.status | default(0)) != 202
    - hostvars['localhost'].orchestrator_record.stage | default('') != 'pending'
  vars:
    at_risk_array: "{{ hostvars['localhost'].event_data.array }}"
    used_pct: "{{ hostvars['localhost'].event_data.used_pct }}"
    used_bytes: "{{ hostvars['localhost'].event_data.used_bytes }}"
    capacity_bytes: "{{ hostvars['localhost'].event_data.capacity_bytes }}"
    days_to_full: "{{ hostvars['localhost'].event_data.days_to_full }}"
    top_growers: "{{ hostvars['localhost'].event_data.top_growers }}"
    pending_eradication_volumes: "{{ hostvars['localhost'].event_data.pending_eradication_volumes }}"
    pending_eradication_snapshots: "{{ hostvars['localhost'].event_data.pending_eradication_snapshots }}"
    candidate_targets: "{{ hostvars['localhost'].event_data.others }}"
